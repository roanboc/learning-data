# Finance's open requirements, while its mart is built. Temporary: each item is deleted once it's
# done, and this file with its last item. The schema is in requirements/README.md.

scope: {kind: consumer, name: finance, code: FIN}

items:

  - id: REQ-FIN-01
    type: requirement
    step: scope
    title: Match Finance's own number
    text: The mart gives the tuition forgone Finance worked out for the census, faculty by faculty.
    owner: Finance
    status: open
    done_when: >
      A reconciliation test compares the mart with Finance's tuition report, faculty by faculty,
      and passes on every build.

  - id: REQ-FIN-02
    type: requirement
    step: consumer_output
    title: The rows and columns the forecast needs
    text: One row per learner per award they're enrolled in, as at census date, with the faculty, the
      award type, the recognised credit points, the rate per credit point and the tuition forgone.
      No names or emails.
    owner: Finance
    status: open
    done_when: >
      The mart's contract enforces these columns and their types, and its grain is tested as a key.
