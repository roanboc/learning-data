  description: 'The hours to pay: each claim approved for the coming pay day, with the hours and pay it
    gives, as the claims job sends them to the payroll system at 22:00 on the Monday before it (resources/claims.job.yml).
    A claim approved by noon on that Monday is paid that Thursday (pay_day_for(), on payroll''s calendar,
    the seed pay_days). The pay run is open from the day its claims close to the day payroll closes it,
    at noon on the Tuesday: built on any other day, the model is empty and the job sends nothing. Payroll
    pays from its own system, which the university buys and doesn''t run on the platform; these rows are
    the one thing in the claims'' story that leaves the platform. Its tests name their owner, HR, in their
    own meta: the hours and pay are HR''s to answer for.'
