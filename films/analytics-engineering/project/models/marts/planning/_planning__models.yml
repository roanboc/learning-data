models:

  - name: mart_planning__near_award
    description: >
      Every award a learner was enrolled in, or held credit towards, on the census date, with
      the credit they held and how far they were from it. As it was: every entity is read at
      its version on the census date, so a change recorded later, dated after census, doesn't
      change the answer. No names or emails: Planning counts learners, it doesn't need to know
      who they are.
    config:
      meta:
        grain: One row per learner per award, as at census date
        glossary_term: near_award
        owner: Planning
        domain: planning
        consumer: Census dashboard
    constraints:
      - type: primary_key
        name: pk_mart_planning__near_award
        columns: [learner_award_key]
        warn_unenforced: false
    data_tests:
      # the grain, tested as a key
      - unique_combination:
          arguments:
            columns: [learner_key, award_key]
    columns:
      - name: learner_award_key
        description: '{{ doc("learner_award_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        data_tests: [unique]
        config:
          meta: {personal_data: pseudonymous}
      - name: census_date
        description: '{{ doc("census_date") }}'
        data_type: date
        constraints: [{type: not_null}]
      - name: learner_key
        description: '{{ doc("learner_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('core_learner')
                field: learner_key
        config:
          meta: {glossary_term: learner, personal_data: pseudonymous}
      - name: award_key
        description: '{{ doc("award_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        config:
          meta: {glossary_term: award}
      - name: award_code
        description: The award's code.
        data_type: string
      - name: award_name
        description: The award's name on the census date.
        data_type: string
      - name: award_type
        description: '{{ doc("award_type") }}'
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [graduate certificate, master]
      - name: faculty_code
        description: '{{ doc("faculty_code") }}'
        data_type: string
        constraints: [{type: not_null}]
      - name: faculty_name
        description: '{{ doc("faculty_name") }}'
        data_type: string
      - name: learner_status
        description: '{{ doc("learner_status") }} On the census date.'
        data_type: string
      - name: is_enrolled
        description: True when the learner was enrolled in this award on the census date.
        data_type: boolean
        constraints: [{type: not_null}]
      - name: credit_points_required
        description: '{{ doc("credit_points_required") }}'
        data_type: int
      - name: credit_points_from_units
        description: '{{ doc("credit_points_from_units") }} On the census date.'
        data_type: int
      - name: credit_points_from_microcredentials
        description: '{{ doc("credit_points_from_microcredentials") }} On the census date.'
        data_type: int
      - name: credit_points_earned
        description: '{{ doc("credit_points_earned") }} On the census date.'
        data_type: int
        constraints: [{type: not_null}]
      - name: credit_points_remaining
        description: '{{ doc("credit_points_remaining") }}'
        data_type: int
        constraints: [{type: not_null}]
      - name: is_near_award
        description: >
          True when, on the census date, the learner was studying, enrolled in this award, and
          within the var near_award_credit_points of it: more than none left, and no more than
          that many.
        data_type: boolean
        config:
          meta: {glossary_term: near_award}
        constraints: [{type: not_null}]
