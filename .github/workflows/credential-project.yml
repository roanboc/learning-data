# Builds and tests the example dbt project behind "In the weeds of data crafting" on DuckDB, and
# checks that its generated docs are current, on every pull request and push to main that touches
# it. No secrets needed: the Databricks target isn't used here (see the project's README).
name: Credential project

on:
  pull_request:
    paths:
      - films/analytics-engineering/project/**
      - .github/workflows/credential-project.yml
  push:
    branches: [main]
    paths:
      - films/analytics-engineering/project/**
      - .github/workflows/credential-project.yml

permissions:
  contents: read

concurrency:
  group: credential-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: films/analytics-engineering/project
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: films/analytics-engineering/project/requirements.txt

      - name: Install dbt Core and dbt-duckdb
        run: pip install -r requirements.txt

      - name: Build and test on DuckDB
        run: dbt build --profiles-dir .

      - name: Doc blocks match the conceptual model
        run: python scripts/definitions.py --check

      - name: Physical diagram matches the YAML
        run: python scripts/diagrams.py --check
