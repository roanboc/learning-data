sources:
  - name: learning_platform
    description: '{{ doc("source_learning_platform") }}'
    database: "{{ env_var('DBT_SOURCES_CATALOG', target.database) }}"
    schema: "{{ env_var('DBT_SOURCES_SCHEMA_PREFIX', '') }}learning_platform"
    config:
      # Read by dbt-duckdb only: on DuckDB each table is a CSV file in data/. Databricks reads the ingested table.
      external_location: "read_csv('data/learning_platform/{name}.csv', header = true, all_varchar = true)"
      # on DuckDB the column is text; on Databricks the cast does nothing
      loaded_at_field: "cast(_loaded_at as timestamp)"
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 3, period: day}
      meta:
        owner: Learning team
        key_set: LMS
    tables:
      - name: users
        description: One row per version of a platform account. The system key is the user ID.
        config:
          meta:
            system_key: [user_id]
        columns:
          - name: user_id
            description: The platform's user ID, like u-88213.
          - name: student_id
            description: The student ID, typed in by staff when the account is created. Often missing; sometimes wrong.
      - name: badges
        description: >
          One row per version of a badge issued on the platform. The system key is the badge ID.
          The platform has no revocation flag: a revoked badge is deleted, so its last version is
          closed and none follows.
        config:
          meta:
            system_key: [badge_id]
