apiVersion: v3.1.0
kind: DataContract
id: 620479e4-7133-57fe-a94f-31e7fe1168bc
name: core_credential_v1
version: 1.0.0
status: deprecated
domain: student
dataProduct: learner_records
description:
  purpose: Every learner the university has recorded learning with, in any system, as one learner with
    one key; the credentials they hold; and the credit they hold towards each award, version by version.
    The enterprise record that every consumer builds on.
  usage: Pin the version you read (ref('core_credential', v=2)). Join on the hash keys; show the readable
    keys only where people need them. Read as at a date with valid_from and valid_to.
  limitations: 'LIM-STU-01: Revocation dates are the day a source stopped showing a credential as held.
    A badge: the day the platform stopped showing it. A short-course certificate: the day its enrolment
    stopped being completed. An award: the day a later record of the same award stopped being completed.
    It may have been revoked earlier, and a badge deleted for another reason also counts as revoked. LIM-STU-05:
    An incremental run re-merges only what changed. core_credential merges credentials whose source rows
    were written since the last run, and credentials whose holder was matched to another learner. A change
    to the model''s logic reaches existing rows only with --full-refresh. LIM-STU-06: No source records
    an expiry. status allows expired; nothing sets it yet.'
schema:
- name: core_credential_v1
  physicalName: core_credential_v1
  logicalType: object
  physicalType: table
  description: 'Version 1: a credential issued to a learner, with is_revoked in place of status. Deprecated:
    status replaces is_revoked in version 2, because a credential can also expire. Version 1 came first;
    version 2 now holds the logic, and version 1 is built from it until 31 March 2027. Temporary: removed
    after its deprecation date, once its consumers have moved to version 2.'
  properties:
  - name: credential_key
    logicalType: string
    physicalType: string
    required: true
    classification: pseudonymous
    primaryKey: true
    primaryKeyPosition: 1
    description: 'The credential''s hash key: the sha-256 of `credential_bk`.'
    quality:
    - id: unique_core_credential_v1_credential_key
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
    - id: not_null_core_credential_v1_credential_key
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
  - name: credential_bk
    logicalType: string
    physicalType: string
    required: true
    classification: direct
    description: 'The credential''s business key, readable and qualified by the key set of the system
      that issued it: `LMS|B-5010`, `SC|C-88`, `SIS|S-20417|GCDA`.'
  - name: learner_key
    logicalType: string
    physicalType: string
    required: true
    classification: pseudonymous
    description: 'The learner''s hash key: the sha-256 of `learner_bk`, as 64 hex characters. The same
      learner has the same key in every model, on every engine.'
    quality:
    - id: relationships_core_credential_v1_learner_key__learner_key__ref_core_learner_
      type: custom
      engine: dbt
      implementation: 'relationships: relationships_core_credential_v1_learner_key__learner_key__ref_core_learner_'
      dimension: consistency
      severity: error
  - name: key_set
    logicalType: string
    physicalType: string
    required: false
    classification: none
    description: 'Where a key comes from: `SIS` (student system), `LMS` (learning platform), `SC` (short-course
      platform), `HR` (HR system), `RES` (research system) or `ALU` (alumni system). Each key set is an
      attribute of the source that issues it (`meta.key_set` in `sources/<system>/`), and they''re listed
      in the `key_sets` seed.'
    quality:
    - id: relationships_core_credential_v1_key_set__key_set__ref_key_sets_
      type: custom
      engine: dbt
      implementation: 'relationships: relationships_core_credential_v1_key_set__key_set__ref_key_sets_'
      dimension: consistency
      severity: error
  - name: credential_kind
    logicalType: string
    physicalType: string
    required: false
    classification: none
    description: 'The kind of credential: `award` (conferred by the registrar), `microcredential` (carries
      credit points) or `badge` (carries none).'
    quality:
    - id: accepted_values_core_credential_v1_credential_kind__award__microcredential__badge
      metric: invalidValues
      mustBe: 0
      unit: rows
      arguments:
        validValues:
        - award
        - microcredential
        - badge
      dimension: conformity
      severity: error
  - name: credential_code
    logicalType: string
    physicalType: string
    required: false
    classification: none
    description: The issuing system's code for what the credential is for, like MC-SQL or GCDA.
  - name: credential_name
    logicalType: string
    physicalType: string
    required: false
    classification: none
    description: What the credential is for, as the system that issued it names it.
  - name: credit_points
    logicalType: integer
    physicalType: int
    required: false
    classification: none
    description: 'The credit points the credential carries: zero for a badge; for an award, the points
      it requires.'
  - name: issued_on
    logicalType: date
    physicalType: date
    required: true
    classification: none
    description: The date the credential was issued, or the award conferred.
  - name: is_revoked
    logicalType: boolean
    physicalType: boolean
    required: false
    classification: none
    description: True when the credential was revoked. Replaced by status in version 2.
