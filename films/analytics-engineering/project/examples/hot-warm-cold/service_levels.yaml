# How fresh, and how long it's kept: the answers to Noor's two questions, as each went into the data's
# contract in September 2026. Three documents, one per contract, each with only what the answer sets: the
# Open Data Contract Standard's service levels (slaProperties, v3.1.0), its owner, and its temperature.
# Written by hand for the film: the project's own contracts are generated (governance/5-data-contracts/),
# and every one of them is warm.
apiVersion: v3.1.0
kind: DataContract
id: 2a3e5c1d-7b40-4e6f-9a21-0c8d5f3b6e17
name: contracts
version: 1.1.0
status: active
domain: hr
description:
  purpose: Every contract in the HR system as it stands now, for the claims app, which checks each claim
    against it. Claims approved by noon on Monday are paid on Thursday, so a change HR records on a Monday
    morning has to reach the app before noon.
  limitations: No pay or rate of pay travels in it.
slaProperties:
- id: contracts_latency
  property: latency
  value: 60
  unit: s
  element: contracts.changed_at
  driver: operational
  description: Each change HR records is in the table within a minute. Until September 2026, once a night.
team:
  name: Ingrid Holm, HR
  members:
  - username: ingrid.holm@uni.example
    name: Ingrid Holm, HR
    role: owner
customProperties:
- property: temperature
  value: hot
  description: Needed within seconds or minutes, and read all the time.
---
apiVersion: v3.1.0
kind: DataContract
id: 8f1c6d42-3e95-4b07-b2d8-5a6e9c0f4d31
name: spending_by_faculty
version: 1.0.0
status: active
domain: finance
description:
  purpose: What each faculty has spent this year against its budget, read each morning by Finance and the
    faculties' managers. Only the answer, one row per faculty, never a copy of the ledger.
slaProperties:
- id: spending_frequency
  property: frequency
  value: 1
  unit: d
  driver: analytics
  scheduler: cron
  schedule: 0 2 * * *
  description: Worked out each night at 02:00, Sydney time, from the finance system's ledger, read in place.
- id: spending_latency
  property: latency
  value: 1
  unit: d
  driver: analytics
  description: Yesterday's figures. Fresh enough for the morning's look.
- id: spending_ready
  property: timeOfAvailability
  value: '07:00'
  driver: analytics
  description: Ready by 7 a.m., Sydney time.
team:
  name: Rohan Desai, Finance
  members:
  - username: rohan.desai@uni.example
    name: Rohan Desai, Finance
    role: owner
customProperties:
- property: temperature
  value: warm
  description: Fresh to the hour or the day, and read often.
---
apiVersion: v3.1.0
kind: DataContract
id: c47b2e90-1d6a-4f38-8e5c-93a0b7d2f615
name: pay_records
version: 1.1.0
status: active
domain: hr
description:
  purpose: A record of each pay, with the hours each casual tutor worked, kept as the law asks.
  usage: Rarely read after the first year, for an audit or a question about a past pay. An archived year
    takes hours to bring back.
slaProperties:
- id: pay_records_frequency
  property: frequency
  value: 14
  unit: d
  driver: regulatory
  description: Each pay day, every second Thursday.
- id: pay_records_retention
  property: retention
  value: 7
  unit: y
  element: pay_records.contract_ends_on
  driver: regulatory
  description: Kept for 7 years after each contract ends, then deleted, on a date set in advance each year
    (Fair Work Act 2009, s 535; Fair Work Regulations 2009, reg 3.33).
team:
  name: Ingrid Holm, HR
  members:
  - username: ingrid.holm@uni.example
    name: Ingrid Holm, HR
    role: owner
customProperties:
- property: temperature
  value: cold
  description: Rarely read, but kept. Cheap, until the date it may be deleted.
- property: archivedAfter
  value: 365 days
  description: Each data file moves to the storage's archive tier a year after it's written (the storage
    account's lifecycle rule, and delta.timeUntilArchived on the table).
