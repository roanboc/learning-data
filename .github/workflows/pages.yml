# Publishes the exact main commit that passed Checks, or an explicitly requested deployment.
# One-time setting: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish site

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # On the job, not the workflow: a run for a cancelled or failed Checks run is skipped before it joins the queue, so it
    # can't replace a waiting deployment of a commit that passed.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore and verify the published audio
        run: python site-tools/media.py fetch
      - name: Validate the assembled site
        run: |
          pip install markdown
          python site-tools/check_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # The site is about 500 MB; GitHub's syncing has taken over the default 10 minutes (01:15 and 03:12 UTC, 10 Nov).
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
