# Run explicitly after committing new audio.json pointers. Audio releases are prereleases,
# so they never replace the video release used by the site's latest-download links.
# Leave the tag blank to publish every missing audio release whose MP3 is in the repository,
# and verify every pointer's copy; existing assets are never uploaded again or replaced.
name: Store audio outside Git

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Audio release tag; blank publishes every missing release (the first migration was audio-v1)"
        required: false
        default: ""
      film:
        description: "Optional film release key; blank with a tag publishes the whole tag"
        required: false

permissions:
  contents: read

concurrency:
  group: audio-release-${{ inputs.tag || 'all' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Publish or resume the selected immutable audio assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FILM: ${{ inputs.film }}
        run: |
          args=()
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          if [ -n "$FILM" ]; then args+=(--film "$FILM"); fi
          python site-tools/media.py publish "${args[@]}"
