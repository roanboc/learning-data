seeds:

  - name: status_map
    description: >
      One row per status code per system, with the canonical status it means: ENR, active and 1
      all mean studying. Reference data, owned by the registrar's office; changes come through a
      pull request they approve.
    config:
      column_types: {key_set: string, source_code: string, source_label: string, canonical_status: string}
      meta: {owner: "Mei Tanaka, registrar's office", domain: student}
    data_tests:
      - unique_combination:
          arguments:
            columns: [key_set, source_code]
    columns:
      - name: key_set
        description: '{{ doc("key_set") }}'
        data_tests:
          - relationships:
              arguments:
                to: ref('key_sets')
                field: key_set
      - name: source_code
        description: The code as the system holds it.
      - name: source_label
        description: What the system means by it.
      - name: canonical_status
        description: '{{ doc("learner_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: [studying, inactive, withdrawn, completed]

  - name: learner_identity_decisions
    description: >
      One row per decision a person made about two keys: the same learner, or different people.
      A decision beats every matching rule. Owned by the registrar's office.
    config:
      column_types:
        decision_id: string
        qualified_key: string
        decision: string
        other_qualified_key: string
        decided_by: string
        decided_on: date
        reason: string
      meta: {owner: "Mei Tanaka, registrar's office", domain: student}
    columns:
      - name: decision_id
        description: The decision's ID.
        data_tests: [unique, not_null]
      - name: qualified_key
        description: The key the decision is about.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_learner_keys')
                field: qualified_key
        config:
          meta: {personal_data: direct}
      - name: decision
        description: "same: the two keys are one learner. different: they're two people, whatever the rules say."
        data_tests:
          - accepted_values:
              arguments:
                values: [same, different]
      - name: other_qualified_key
        description: The other key. For a "same" decision, the key of the learner this key belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_learner_keys')
                field: qualified_key
        config:
          meta: {personal_data: direct}
      - name: decided_by
        description: '{{ doc("decided_by") }}'
        data_tests: [not_null]
      - name: decided_on
        description: '{{ doc("decided_on") }}'
        data_tests: [not_null]
      - name: reason
        description: Why, with the evidence they used.
        data_tests: [not_null]

  - name: credit_recognition
    description: >
      One row per microcredential per award that recognises it: which microcredentials count
      towards which awards. Each faculty decides for its own awards.
    config:
      column_types: {key_set: string, credential_code: string, award_code: string, approved_by: string, approved_on: date}
      meta: {owner: The faculties, domain: student}
    data_tests:
      - unique_combination:
          arguments:
            columns: [key_set, credential_code, award_code]
    columns:
      - name: key_set
        description: '{{ doc("key_set") }}'
      - name: credential_code
        description: The microcredential's code in its system.
      - name: award_code
        description: The award it counts towards.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_student_system__awards')
                field: award_code
      - name: approved_by
        description: The faculty that recognised it.
      - name: approved_on
        description: When.
