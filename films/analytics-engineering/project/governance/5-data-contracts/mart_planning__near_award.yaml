name: mart_planning__near_award
version: 1.0.0
status: active
domain: planning
dataProduct: learners_near_an_award
description:
  purpose: How many learners are near a graduate certificate (within the near_award_credit_points var),
    by faculty, as at census date. Planning's answer for the census, and for anyone who plans support
    for those learners.
  usage: Count learners with is_near_award. The numbers are as at census date, and reconcile with the
    census report.
  limitations: 'LIM-PLN-01: The Planning mart applies identity as it''s known today to the census date.
    The census team matched two learners by hand before publishing on 14 April 2026; the registrar''s
    office recorded the same matches as identity decisions D-001 and D-002 in October. Without those decisions,
    the mart counts 10 learners, not 12, and the reconciliation fails.'
schema:
- name: mart_planning__near_award
  physicalName: mart_planning__near_award
  logicalType: object
  physicalType: table
  description: 'Every award a learner was enrolled in, or held credit towards, on the census date, with
    the credit they held and how far they were from it. As it was: every entity is read at its version
    on the census date, so a change recorded later, dated after census, doesn''t change the answer. No
    names or emails: Planning counts learners, it doesn''t need to know who they are.'
  properties:
  - name: learner_award_key
    logicalType: string
    physicalType: string
    required: true
