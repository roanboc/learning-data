# Decisions about the project as a whole: what was decided, why, and who decided.
# Permanent: a decision is never deleted; a replaced one is marked superseded and relates to
# what replaced it. The schema is in requirements/README.md, and docs/decisions.md indexes
# every log. Not parsed by dbt (.dbtignore).

scope: {kind: project, name: project, code: PRJ}

decisions:

  - id: DEC-PRJ-01
    step: source_reality
    title: Keys are qualified by their key set
    text: 'Keys are qualified by where they come from: key sets SIS, LMS and SC. Every hash is kept beside
      its readable key.'
    why: Two systems can use the same-looking key for different people. A hash alone can't be read or checked.
    decided_by: Noor, data architect
    decided_on: 2026-10-05
    status: agreed
    implemented_in: [business_key, hash_key, key_sets]

  - id: DEC-PRJ-02
    step: operate_and_evolve
    title: Every core model is versioned
    text: Every core model is versioned, from version 1, and consumers pin the version they read.
    why: A breaking change then arrives as a new version beside the old one, with a deprecation date, not
      as a surprise.
    decided_by: Noor, data architect
    decided_on: 2026-10-10
    status: agreed

  - id: DEC-PRJ-03
    step: build
    title: One project, groups per owner, until teams own their domains
    text: One group owns staging, intermediate and core while one team builds them; Planning and the wallet
      each own their marts. Split into projects when teams own their domains.
    why: Groups control who can ref() what within a project. Separate projects add cost that pays off only
      with separate teams.
    decided_by: Noor, data architect
    decided_on: 2026-10-12
    status: agreed
    implemented_in: [_groups.yml]

  - id: DEC-PRJ-04
    step: written_once
    title: Definitions are written once and generated
    text: Definitions are written once, in the conceptual model, and generated into doc blocks. The physical
      diagram is generated from the manifest. Descriptions go to Unity Catalog with persist_docs.
    why: Four copies of a definition drift apart. One home, and one direction of sync, keeps them the same.
    decided_by: Jun Park and Noor
    decided_on: 2026-10-14
    status: agreed

  - id: DEC-PRJ-05
    step: build
    title: Organised by domain, following TCSI
    text: 'The project is organised by domain, following TCSI: student and course in the core, planning
      and wallet in the marts. Each domain''s conceptual model, definitions, column descriptions and physical
      diagram live in its folder; docs/ keeps the process.'
    why: In a large project, each domain owns its meaning and changes it on its own. Definitions kept beside
      their models are found and reviewed with them. A public reference model gives the domains names others
      recognise.
    decided_by: Noor, data architect
    decided_on: 2026-10-15
    status: agreed
    relates_to: [DEC-PRJ-03]

  - id: DEC-PRJ-06
    step: scope
    title: The conceptual model at two levels; sources, models and exposures apart
    text: 'The conceptual model is written at two levels: a map of the university''s domains and key entities
      (at most 50, modelled or planned, following TCSI), and each core domain and mart''s own. Sources,
      models and exposures each get a top-level folder.'
    why: The map shows where each domain sits and what's still to model, without the detail; the detail
      stays with its owner. What comes in, what's built and who uses it are different things, and each is
      easy to find on its own.
    decided_by: Noor, data architect
    decided_on: 2026-10-16
    status: agreed
    relates_to: [DEC-PRJ-05]

  - id: DEC-PRJ-07
    step: written_once
    title: Key sets live on their source
    text: A key set is an attribute of the source that issues it (meta.key_set), with its keys and the
      case staging writes each in. The key_sets seed is generated from the sources.
    why: The key set is a fact about a source, so it lives with the source, and moves with it.
    decided_by: Noor, data architect
    decided_on: 2026-10-17
    status: agreed
    relates_to: [DEC-PRJ-01, DEC-PRJ-05]

  - id: DEC-PRJ-08
    step: build
    title: DuckDB here and in CI; Databricks for the university
    text: DuckDB runs the project here and in CI; Databricks runs it for the university.
    why: Anyone can run it with no account, and the same code runs on the university's platform.
    status: agreed

  - id: DEC-PRJ-09
    step: build
    title: Primary and foreign keys declared on Databricks only
    text: Primary and foreign keys are declared for Databricks and left out on DuckDB. Tests check keys
      on both.
    why: Databricks records them as information and doesn't enforce them. DuckDB enforces them, and won't
      rename or drop a table a foreign key points to, which dbt does to rebuild it.
    status: agreed
    implemented_in: [duckdb__get_table_columns_and_constraints]

  - id: DEC-PRJ-10
    step: written_once
    title: Requirements are temporary; decisions and limitations are permanent
    text: What's still open while something is built (a question, a requirement, a gap) is an item in
      requirements/, saying what will show it's done, and deleted once it is. What lasts goes to its
      home - a decision in its scope's log, next to what it's about; a known limitation in meta.limitations
      on the model or source it affects; an answered question in the mart's conceptual model; a met
      requirement in the test or metadata that enforces it.
    why: The team's backlog tool already tracks the work; requirements/ shouldn't copy it. Kept only while
      open, it shows exactly what to watch. What lasts is easier to find, and travels with its domain,
      when it sits next to what it's about; limitations on the YAML reach the people who read the data.
    decided_by: Noor, data architect
    decided_on: 2026-10-17
    status: agreed
    relates_to: [DEC-PRJ-05, DEC-PRJ-06]

  - id: DEC-PRJ-11
    step: written_once
    title: The business glossary is the source of a definition it holds
    text: 'Where the university''s business glossary (in Unity Catalog) defines an entity, data governance
      names the term that applies, and the conceptual model takes its definition, recording the term in
      source:. The project adds only what the glossary doesn''t hold: keys, identity rules, history. An entity
      the glossary doesn''t define is defined in the conceptual model, once governance confirms there''s no
      term for it. A sync compares the two on a schedule; a changed term arrives as a pull request, never
      as a silent edit.'
    why: A definition the company already keeps is the home; a second one written in the project would be
      a fifth copy. A changed definition can change what a model counts and what its descriptions say, so
      the change is reviewed, with what it touches, before it reaches the build.
    decided_by: Noor and Mei Tanaka, with data governance
    decided_on: 2026-10-14
    status: agreed
    relates_to: [DEC-PRJ-04]
    implemented_in: [_course__conceptual.yml, definitions.py, sync-the-glossary]
