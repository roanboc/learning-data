# Project-wide requirements: what every domain shares. The schema is in requirements/README.md.
scope:
  kind: project
  name: project
  code: PRJ

items:

  - id: DEC-PRJ-01
    type: decision
    step: source_reality
    title: Keys are qualified by their key set
    text: >
      Keys are qualified by where they come from: key sets SIS, LMS and SC. Every hash is kept
      beside its readable key.
    why: Two systems can use the same-looking key for different people. A hash alone can't be read or checked.
    decided_by: Noor, data architect
    decided_on: 2026-10-05
    status: delivered
    implemented_in: [business_key, hash_key, key_sets]

  - id: DEC-PRJ-02
    type: decision
    step: operate_and_evolve
    title: Every core model is versioned
    text: Every core model is versioned, from version 1, and consumers pin the version they read.
    why: A breaking change then arrives as a new version beside the old one, with a deprecation date, not as a surprise.
    decided_by: Noor, data architect
    decided_on: 2026-10-10
    status: delivered

  - id: DEC-PRJ-03
    type: decision
    step: build
    title: One project, groups per owner, until teams own their domains
    text: >
      One group owns staging, intermediate and core while one team builds them; Planning and the
      wallet each own their marts. Split into projects when teams own their domains.
    why: Groups control who can ref() what within a project. Separate projects add cost that pays off only with separate teams.
    decided_by: Noor, data architect
    decided_on: 2026-10-12
    status: delivered
    implemented_in: [_groups.yml]

  - id: DEC-PRJ-04
    type: decision
    step: written_once
    title: Definitions are written once and generated
    text: >
      Definitions are written once, in the conceptual model, and generated into doc blocks. The
      physical diagram is generated from the manifest. Descriptions go to Unity Catalog with
      persist_docs.
    why: Four copies of a definition drift apart. One home, and one direction of sync, keeps them the same.
    decided_by: Jun Park and Noor
    decided_on: 2026-10-14
    status: delivered

  - id: DEC-PRJ-05
    type: decision
    step: build
    title: Organised by domain, following TCSI
    text: >
      The project is organised by domain, following TCSI: student and course in the core,
      planning and wallet in the marts. Each domain's conceptual model, definitions, column
      descriptions and physical diagram live in its folder; docs/ keeps the process.
    why: >
      In a large project, each domain owns its meaning and changes it on its own. Definitions kept
      beside their models are found and reviewed with them. A public reference model gives the
      domains names others recognise.
    decided_by: Noor, data architect
    decided_on: 2026-10-15
    status: delivered
    relates_to: [DEC-PRJ-03]

  - id: DEC-PRJ-06
    type: decision
    step: scope
    title: The conceptual model at two levels; sources, models and exposures apart
    text: >
      The conceptual model is written at two levels: a map of the university's domains and key
      entities (at most 50, modelled or planned, following TCSI), and each core domain and mart's
      own. Sources, models and exposures each get a top-level folder.
    why: >
      The map shows where each domain sits and what's still to model, without the detail; the
      detail stays with its owner. What comes in, what's built and who uses it are different
      things, and each is easy to find on its own.
    decided_by: Noor, data architect
    decided_on: 2026-10-16
    status: delivered
    relates_to: [DEC-PRJ-05]

  - id: DEC-PRJ-07
    type: decision
    step: written_once
    title: Key sets live on their source; requirements live with what they're about
    text: >
      A key set is an attribute of the source that issues it, with its keys and their case. Every
      question, requirement, decision, gap and limitation is an item in a register, in
      requirements/, in the folder of the source, domain or consumer it's about, tagged with the
      step of the process it belongs to.
    why: >
      The key set is a fact about a source, so it lives with the source. Registers kept by domain
      move with the domain when it becomes its own project; one schema lets them be read, checked
      and indexed together.
    decided_by: Noor, data architect
    decided_on: 2026-10-17
    status: delivered
    relates_to: [DEC-PRJ-01, DEC-PRJ-05]

  - id: DEC-PRJ-08
    type: decision
    step: build
    title: DuckDB here and in CI; Databricks for the university
    text: DuckDB runs the project here and in CI; Databricks runs it for the university.
    why: Anyone can run it with no account, and the same code runs on the university's platform.
    status: delivered

  - id: DEC-PRJ-09
    type: decision
    step: build
    title: Primary and foreign keys declared on Databricks only
    text: Primary and foreign keys are declared for Databricks and left out on DuckDB. Tests check keys on both.
    why: >
      Databricks records them as information and doesn't enforce them. DuckDB enforces them, and
      won't rename or drop a table a foreign key points to, which dbt does to rebuild it.
    status: delivered
    implemented_in: [duckdb__get_table_columns_and_constraints]
