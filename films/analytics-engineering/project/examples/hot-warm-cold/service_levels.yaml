apiVersion: v3.1.0
kind: DataContract
id: c47b2e90-1d6a-4f38-8e5c-93a0b7d2f615
name: pay_records
version: 1.1.0
status: active
domain: hr
description:
  purpose: A record of each pay, with the hours each casual tutor worked, kept as the law asks.
  usage: Rarely read after the first year, for an audit or a question about a past pay. An archived year
    takes hours to bring back.
slaProperties:
- id: pay_records_frequency
  property: frequency
  value: 14
  unit: d
  driver: regulatory
  description: Each pay day, every second Thursday.
- id: pay_records_retention
  property: retention
  value: 7
  unit: y
  element: pay_records.contract_ends_on
  driver: regulatory
  description: Kept for 7 years after each contract ends, then deleted, on a date set in advance each year
    (Fair Work Act 2009, s 535; Fair Work Regulations 2009, reg 3.33).
team:
  name: Ingrid Holm, HR
  members:
  - username: ingrid.holm@uni.example
    name: Ingrid Holm, HR
    role: owner
customProperties:
- property: temperature
  value: cold
  description: A batch each pay day, acted on days or weeks later, if at all.
- property: storageTier
  value: hot, then archive
  description: Read often for a year, then rarely, so kept where reading is cheap, then where keeping is
    cheap. How often it's read decides where it's kept; the law and the business, for how long.
- property: archivedAfter
  value: 365 days
  description: Each data file moves to the storage's archive tier a year after it's written (the storage
    account's lifecycle rule, and delta.timeUntilArchived on the table).
---
apiVersion: v3.1.0
kind: DataContract
id: 5d9e0b37-6a2c-4f81-a4e3-17c8b2f60d94
name: bank_account_changes
version: 1.0.0
status: active
domain: hr
description:
  purpose: Each change to a staff member's bank account, as payroll records it, checked against the
    sign-in behind it. A change from a new device close to pay day holds that one pay, and asks the
    person to confirm. In August 2026, two staff members' pay went to a stranger's account.
  limitations: An event carries only what changed. The full pay record, and every correction, still come
    in payroll's nightly file (the cold path), so this never stands alone.
slaProperties:
- id: bank_change_latency
  property: latency
  value: 1
  unit: s
  element: bank_account_changes.changed_at
  driver: operational
  description: Each change is checked, and a pay held if the rule says so, within a second. A report read
    the next morning would come after the money had gone.
team:
  name: Ingrid Holm, HR
  members:
  - username: ingrid.holm@uni.example
    name: Ingrid Holm, HR
    role: owner
customProperties:
- property: temperature
  value: hot
  description: Acted on within a second, by a machine, with no person waiting to decide. It costs the
    most, because it never stops, so very few needs are kept hot.
