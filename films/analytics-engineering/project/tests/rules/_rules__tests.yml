data_tests:

  - name: keys_decided_different_stay_apart
    description: A decision that two keys are different people holds, whatever the matching rules do.
    config:
      meta: {owner: "Mei Tanaka, registrar's office", dimension: consistency}

  - name: alumni_graduated_under_a_known_student_id
    description: Every graduate the alumni office knows has a student ID the student system issued, in its current table or its archive.
    config:
      meta: {owner: Alumni office, dimension: consistency}

  - name: approved_claims_have_a_pay_day
    description: >
      Every approved claim has a pay day in payroll's calendar, so none waits for a pay day that
      isn't there. HR adds the next year's pay days before the last close of this one.
    config:
      meta: {owner: HR, dimension: completeness}

  - name: printers_file_has_the_names_graduates_gave
    description: >
      Each name in the printer's file is the name its graduate last gave in the portal for that
      ceremony, a correction still waiting for its check included. Genie Code proposed it and Jun
      Park reviewed it; Mei set it to stop the printer's file (error) until a person settles each
      name. It checks the names in the certificates' level, zero wrong (the graduation list's
      certificates_exactly_right).
    config:
      meta: {owner: "Mei Tanaka, registrar's office", dimension: accuracy, reference: "The graduate, through their last answer in the portal"}

  - name: name_confirmation_columns_agree
    description: >
      The graduation list's two confirmation columns agree: a day in name_confirmed_on exactly when
      name_confirmed_how is portal. Genie Code proposed it; Mei set it to warn and hold for Jun Park,
      as a difference is a fault in the code, not in what graduates did.
    config:
      meta: {owner: "Jun Park, analytics engineer", dimension: consistency}
