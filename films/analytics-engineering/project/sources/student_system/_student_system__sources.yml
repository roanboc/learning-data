sources:
  - name: student_system
    description: '{{ doc("source_student_system") }}'
    database: "{{ env_var('DBT_SOURCES_CATALOG', target.database) }}"
    schema: "{{ env_var('DBT_SOURCES_SCHEMA_PREFIX', '') }}student_system"
    config:
      # Read by dbt-duckdb only: on DuckDB each table is a CSV file in data/. Databricks reads the ingested table.
      external_location: "read_csv('data/student_system/{name}.csv', header = true, all_varchar = true)"
      # on DuckDB the column is text; on Databricks the cast does nothing
      loaded_at_field: "cast(_loaded_at as timestamp)"
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 3, period: day}
      meta:
        owner: Registrar's office
        key_set:
          code: SIS
          system: student system
          owner: Registrar's office
          # Each key the system issues, and the case staging writes it in (docs/conventions.md).
          system_keys:
            - {key: student_id, case: upper, example: S-20417}
            - {key: award_code, case: upper, example: GCDA}
            - {key: result_id, case: upper}
          example: SIS|S-20417
        domain: registrar
    tables:
      - name: learners
        description: One row per version of a student record. The system key is the student ID.
        config:
          meta:
            system_key: [student_id]
        columns:
          - name: student_id
            description: The student ID the registrar's office issues, like S-20417.
          - name: effective_date
            description: '{{ doc("effective_date") }}'
      - name: awards
        description: One row per version of an award the university offers. The system key is the award code.
        config:
          meta:
            system_key: [award_code]
      - name: results
        description: One row per version of a unit result. The system key is the result ID.
        config:
          meta:
            system_key: [result_id]
        columns:
          - name: result_date
            description: '{{ doc("result_date") }}'
      - name: past_learners
        description: >
          One row per version of a student record closed before 1 November 2024, when the student
          system's history here starts: its graduates and withdrawals, from its archive. The
          system key is the student ID. Loaded once, on 1 November 2024, with every version the
          archive kept: `_valid_from` and `_valid_to` say when the student system recorded each
          version, and `_loaded_at` when ingestion loaded it.
        config:
          # Loaded once: nothing new will arrive.
          freshness: null
          meta:
            system_key: [student_id]
            limitations:
              - id: LIM-SIS-01
                text: >
                  Its award codes are the awards of the time, and the awards table holds only
                  those offered since November 2024, so they aren't in it: BHIM, the Bachelor of
                  Health Information Management, and BIT, the Bachelor of Information Technology.
        columns:
          - name: student_id
            description: The student ID the registrar's office issued, like S-17142. A student ID is never given to anyone else.
          - name: effective_date
            description: '{{ doc("effective_date") }}'
      - name: graduations
        description: >
          The student system's list of graduates: one row per version of a graduate's award, with
          the ceremony they're presented at and the names the student system holds for them. A row
          joins the list the night after the faculty's exam board approves the award. The system
          key is the student ID and the award code.
        config:
          meta:
            system_key: [student_id, award_code]
            limitations:
              - id: LIM-SIS-02
                text: >
                  A slice: a few graduates of each round of ceremonies, not all of them, and not in
                  the learners table, the core's slice of 2025 and 2026. Names arrive as the student
                  system's nightly file sends them: until September 2026 that file lost every
                  accent, so é arrived as e.
              - id: LIM-SIS-03
                text: >
                  The conferral date is the one the faculty's exam board approved, typed in from
                  the board's list. Only graduates on this list have one: the student system's own
                  records still don't say when an award was conferred (GAP-SIS-03), so the core
                  still dates an award by DEC-SIS-03.
        columns:
          - name: student_id
            description: The student ID the registrar's office issued, like S-16874.
          - name: family_name
            description: >
              The family name the student system holds: its field takes 30 characters, so a longer
              name was cut when it was typed in.
          - name: conferral_date
            description: The date the faculty's exam board approved the award, printed on the certificate.
          - name: ceremony_id
            description: The ceremony the graduate is presented at, like DEC26-3 (seeds/reference/graduations/ceremonies.csv).
          - name: attendance_code
            description: ATT when the graduate crosses the stage; ABS when the award is conferred in absentia and the certificate posted.
      - name: nightly_files
        description: >
          The receipts of the night's transfer: one row for each nightly file the student system
          sends, and when it arrived on the platform. The load writes the row as the file lands.
          A file arrives every night, even one with few new records, so its age is the student
          system's age; the newest row of a table can be days old after a night when no exam
          board met. The graduation list says its age from it (student_system_as_of).
        config:
          loaded_at_field: "cast(received_at as timestamp)"
          # The level the graduation list's users agreed on 22 June 2026, for the certificates: older
          # than 24 hours, the check fails. One level, with no warning: the night's job runs this check
          # first, and its failure tells Sam Okafor and Malia Fonoti (examples/a-late-file/).
          freshness:
            warn_after: null
            error_after: {count: 24, period: hour}
          meta:
            system_key: [file_name]
        columns:
          - name: file_name
            description: The file's name, with the day of the records it brings, like nightly_2026-06-17.csv.
          - name: received_at
            description: When the file arrived on the platform. The night's files are due at 02:00.
      - name: graduation_applications
        description: >
          The student system's applications to graduate: one row per version of a graduate's
          application to be presented at a ceremony. Until the portal opened in February 2026, a
          graduate applied on the paper graduation form, which asked them to confirm the name to be
          printed and kept no date for it; since then they apply in the portal, and confirm their
          name there (the portal's name_confirmations). The system key is the student ID and the
          ceremony.
        config:
          meta:
            system_key: [student_id, ceremony_id]
        columns:
          - name: student_id
            description: The student ID of the graduate who applied, like S-17790.
          - name: ceremony_id
            description: The ceremony the graduate applied to be presented at, like DEC26-1.
          - name: application_form
            description: >
              paper, the paper graduation form, on which the graduate confirmed the name to be
              printed; portal, an application in the portal, where the graduate confirms their name
              separately.
          - name: received_on
            description: The day the registrar's office received the application.
