# Finance's open requirements, while its mart is built. Temporary: each item is deleted once it's
# done, and this file with its last item. The schema is in requirements/README.md.

scope: {kind: consumer, name: finance, code: FIN}

items:

  - id: REQ-FIN-01
    type: requirement
    step: scope
    title: Match Finance's own number
    text: The mart gives the tuition forgone Finance worked out for the census, faculty by faculty.
    owner: Finance
    status: open
    done_when: >
      A reconciliation test compares the mart with Finance's tuition report, faculty by faculty,
      and passes on every build.

  - id: Q-FIN-01
    type: question
    step: source_reality
    title: The award recognised credit saves tuition in
    text: The core counts recognised credit towards every award it could count towards, so one
      microcredential can count against two or three awards. Which one does it save the learner
      tuition in?
    owner: Finance
    status: open
    done_when: >
      Finance has answered. The answer is a rule on tuition_forgone, in Finance's conceptual model,
      and a decision in Finance's log.
    evidence: [analyses/profiling/profile_credit_across_awards.sql]
