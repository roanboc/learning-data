data_tests:

  - name: reconcile_planning_with_census_report
    description: >
      The Planning mart gives the census team's published number, faculty by faculty. If it
      doesn't, the mart is wrong or the report is; either way, nobody ships until someone knows
      which.
    config:
      meta: {owner: Planning}

  - name: keys_decided_different_stay_apart
    description: A decision that two keys are different people holds, whatever the matching rules do.
    config:
      meta: {owner: "Mei Tanaka, registrar's office"}
