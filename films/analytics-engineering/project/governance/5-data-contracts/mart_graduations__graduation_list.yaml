schema:
- name: mart_graduations__graduation_list
  physicalName: mart_graduations__graduation_list
  logicalType: object
  physicalType: table
  description: 'The graduation list: who graduates, at which ceremony, with which award, and their name
    as it will be printed on the degree certificate. One row per certificate, so a graduate of a double
    degree has two. The graduations office seats the Great Hall, prints the programme and sends the certificates
    to the printer from it, and Planning counts the awards for the government. What each of those uses
    needs is in quality, below.'
  properties:
  - name: graduation_bk
    logicalType: string
    physicalType: string
    required: true
    classification: direct
    criticalDataElement: true
    primaryKey: true
    primaryKeyPosition: 1
    description: The certificate's key, the graduate and the award, qualified by its key set, like SIS|S-16874|MDA.
    quality:
    - id: unique_mart_graduations__graduation_list_graduation_bk
      metric: duplicateValues
      mustBe: 0
      unit: rows
      dimension: uniqueness
      severity: error
  - name: student_bk
    logicalType: string
    physicalType: string
    required: true
    classification: direct
    criticalDataElement: true
    description: 'A system key qualified by its key set: `SIS|S-20417`, `LMS|u-88213`, `SC|aisha.k@mail.example`.
      Two keys that look alike in different systems stay apart. The graduate, so a graduate with two certificates
      is counted once.'
  - name: given_name
    logicalType: string
    physicalType: string
    required: false
    classification: direct
    description: 'The given name to be printed: the one the graduate confirmed in the portal for this
      ceremony, else the student system''s.'
  - name: family_name
    logicalType: string
    physicalType: string
    required: false
    classification: direct
    description: 'The family name to be printed: the one the graduate confirmed in the portal for this
      ceremony, else the student system''s, which holds 30 characters.'
  - name: name_as_printed
    logicalType: string
    physicalType: string
    required: false
    classification: direct
    criticalDataElement: true
    description: 'The whole name as it will be printed and read out, in the graduate''s own order: as
      they confirmed it in the portal for this ceremony, else the student system''s given and family names.
      Its letters are as the platform received them.'
    quality:
    - id: not_null_mart_graduations__graduation_list_name_as_printed
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
  - name: name_confirmed_on
    logicalType: date
    physicalType: date
    required: false
    classification: none
    description: The day the graduate confirmed their name, or corrected it, in the portal for this ceremony;
      a correction counts once the registrar's office has checked it. Empty when they haven't confirmed
      it through the portal.
  - name: award_code
    logicalType: string
    physicalType: string
    required: true
    classification: none
    criticalDataElement: true
    description: The award's code, like MDA.
  - name: award_name
    logicalType: string
    physicalType: string
    required: false
    classification: none
    criticalDataElement: true
    description: The award's name as it was on the day it was conferred, as it's printed on the certificate.
    quality:
    - id: not_null_mart_graduations__graduation_list_award_name
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
  - name: conferred_on
    logicalType: date
    physicalType: date
    required: true
    classification: none
    criticalDataElement: true
    description: The date the faculty's exam board approved the award, printed on the certificate.
  - name: ceremony_id
    logicalType: string
    physicalType: string
    required: true
    classification: none
    criticalDataElement: true
    description: The ceremony the graduate is presented at, like DEC26-3.
  - name: ceremony_on
    logicalType: date
    physicalType: date
    required: false
    classification: none
    description: The day of that ceremony.
    quality:
    - id: not_null_mart_graduations__graduation_list_ceremony_on
      metric: nullValues
      mustBe: 0
      unit: rows
      dimension: completeness
      severity: error
  - name: is_attending
    logicalType: boolean
    physicalType: boolean
    required: true
    classification: none
    criticalDataElement: true
    description: True when the graduate crosses the stage; false when the award is conferred in absentia
      and the certificate posted.
  - name: added_on
    logicalType: date
    physicalType: date
    required: false
    classification: none
    description: The day the certificate's row first joined the list, the night after its award was approved.
  quality:
  - name: seating_plan_count_per_ceremony
    type: text
    description: 'For seating the Great Hall: how many graduates cross the stage at each ceremony. A graduate
      with two certificates takes one seat.'
    dimension: completeness
    severity: error
    businessImpact: Graduates or their guests without a seat, or rows of empty ones.
    customProperties:
    - property: use
      value: seating_plan
    - property: level
      value: Within 2% at each ceremony
    - property: agreedWith
      value: Malia Fonoti, graduations office
  - name: certificates_exactly_right
    type: text
    description: 'For the certificates: each name exactly as the graduate writes it, accents and all,
      and each award and conferral date as the faculty''s exam board approved them, on the list when it
      goes to the printer.'
    dimension: accuracy
    severity: error
    businessImpact: A certificate printed again, about 120 dollars with its courier, and a graduate who
      may cross the stage holding an empty folder.
    customProperties:
    - property: use
      value: certificates
    - property: level
      value: Zero wrong
    - property: agreedWith
      value: Malia Fonoti, graduations office
  - name: programme_as_the_certificates
    type: text
    description: 'For the printed programme: each graduate who crosses the stage, under their ceremony
      and award, with the same name and award as their certificate.'
    dimension: consistency
    severity: error
    businessImpact: A name every guest reads wrong, or a slip in every programme.
    customProperties:
    - property: use
      value: ceremony_programme
    - property: level
      value: No difference from the certificates; a change after it's printed goes on a slip
    - property: agreedWith
      value: Malia Fonoti, graduations office
  - name: awards_return_each_award_once
    type: text
    description: 'For the government''s count of awards: each award conferred in the year, counted once
