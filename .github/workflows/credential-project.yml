# Builds and tests the example dbt project behind "In the weeds of data crafting" on DuckDB,
# checks that its generated docs are current and that its metric gives the census report's
# number, and parses it for Databricks, on every pull request and push to main that touches it.
# No secrets needed: nothing connects to Databricks here (see the project's README).
name: Credential project

on:
  pull_request:
    paths:
      - films/analytics-engineering/project/**
      - .github/workflows/credential-project.yml
  push:
    branches: [main]
    paths:
      - films/analytics-engineering/project/**
      - .github/workflows/credential-project.yml

permissions:
  contents: read

concurrency:
  group: credential-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: films/analytics-engineering/project
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: films/analytics-engineering/project/requirements.txt

      - name: Install dbt Core and dbt-duckdb
        run: pip install -r requirements.txt

      - name: Build and test on DuckDB
        run: dbt build --profiles-dir .

      - name: Doc blocks and key sets match the conceptual model
        run: python scripts/generate/definitions.py --check

      - name: Physical diagram matches the YAML
        run: python scripts/generate/diagrams.py --check

      - name: Decision logs are valid and indexed
        run: python scripts/generate/decisions.py --check

      - name: Requirements hold only what's open
        run: python scripts/check/requirements.py

      - name: The metric gives the census report's number
        run: |
          pip install dbt-metricflow==0.15.0
          DBT_PROFILES_DIR=. mf query --metrics learners_near_graduate_certificate \
            --group-by learner_award__faculty_name,learner_award__census_date --csv target/metric.csv
          python scripts/check/check_metric.py

  databricks-parse:
    # Parses the project for the Databricks target, with no connection and dummy credentials:
    # catches a Databricks-only mistake in the configs, the Jinja or the profile before dbt Cloud.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: films/analytics-engineering/project
    env:
      DATABRICKS_HOST: ci.cloud.databricks.com
      DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci
      DATABRICKS_TOKEN: not-a-token
      DATABRICKS_CATALOG: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: films/analytics-engineering/project/requirements-databricks.txt

      - name: Install dbt-databricks
        run: pip install -r requirements-databricks.txt

      - name: Parse for Databricks
        run: dbt parse --target databricks --profiles-dir . --no-partial-parse --warn-error
