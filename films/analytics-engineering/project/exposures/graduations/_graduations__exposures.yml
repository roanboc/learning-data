exposures:

  - name: seating_plan
    label: Seating the Great Hall
    type: analysis
    maturity: high
    description: >
      The graduations office's plan for each ceremony in the Great Hall: how many graduates cross
      the stage, and so how many seats, gowns and guests' tickets, and how long the ceremony runs.
      Made a week before each round of ceremonies.
    owner:
      name: "Malia Fonoti, graduations office"
      email: malia.fonoti@uni.example
    depends_on:
      - ref('mart_graduations__graduation_list')

  - name: certificates
    label: Degree certificates
    type: application
    maturity: high
    description: >
      The file the certificate printer prints every degree certificate from: each certificate's
      name, award and conferral date. The graduations office sends it at 5 pm on the Thursday
      about four weeks before a round's first ceremony; a change after that is a certificate
      printed again.
    owner:
      name: "Malia Fonoti, graduations office"
      email: malia.fonoti@uni.example
    depends_on:
      - ref('mart_graduations__certificates_file')

  - name: ceremony_programme
    label: The printed programme
    type: application
    maturity: high
    description: >
      The programme each guest is given at a ceremony: every graduate who crosses the stage, by
      award, in the order they're presented. Printed with the certificates.
    owner:
      name: "Malia Fonoti, graduations office"
      email: malia.fonoti@uni.example
    depends_on:
      - ref('mart_graduations__graduation_list')

  - name: names_to_confirm_each_week
    label: Names still to confirm
    type: analysis
    maturity: medium
    description: >
      The count the graduations office follows each week before a round's names go to the
      printer: the graduates who haven't confirmed their name, in the portal or on paper, by
      ceremony. Malia writes to each one.
    owner:
      name: "Malia Fonoti, graduations office"
      email: malia.fonoti@uni.example
    depends_on:
      - ref('mart_graduations__names_to_confirm')

  - name: graduations_agent
    label: The graduations team's agent
    type: application
    maturity: medium
    description: >
      The graduations team's Genie Agent, which answers questions about the graduation list from
      the list and the follow-up, reading their descriptions in Unity Catalog, where dbt writes
      them on every run. Its trusted answer to "which graduates haven't confirmed their name?" is
      the follow-up's count (examples/read-by-an-agent/).
    owner:
      name: "Malia Fonoti, graduations office"
      email: malia.fonoti@uni.example
    depends_on:
      - ref('mart_graduations__graduation_list')
      - ref('mart_graduations__names_to_confirm')
