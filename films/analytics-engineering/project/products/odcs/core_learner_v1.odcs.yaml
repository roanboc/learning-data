apiVersion: v3.1.0
kind: DataContract
id: 7f4e3b17-5f84-50e5-8580-d6f86325f4da
name: core_learner_v1
version: 1.0.0
status: active
domain: student
dataProduct: learner_records
description:
  purpose: Every learner the university has recorded learning with, in any system, as one learner with
    one key; the credentials they hold; and the credit they hold towards each award, version by version.
    The enterprise record that every consumer builds on.
  usage: Pin the version you read (ref('core_credential', v=2)). Join on the hash keys; show the readable
    keys only where people need them. Read as at a date with valid_from and valid_to.
  limitations: 'LIM-STU-02: A learner the student system doesn''t know keeps the key of the first system
    that recorded them. The learning platform comes first on a tie. The key changes only when they''re
    matched to a student ID, by a rule (a student ID in their platform account, an email only one student
    has) or by the registrar''s office. Their old key stays in int_learner_keys. LIM-STU-03: A learner
    with two keys in one system gets one value per attribute. Two platform accounts, or two short-course
    emails - on each date, that system''s version recorded last wins. LIM-STU-07: Platform dates are the
    day the platform recorded a change, not the day it happened. Only the student system says when a change
    took effect.'
schema:
- name: core_learner_v1
  physicalName: core_learner_v1
  logicalType: object
  physicalType: table
  description: 'What the model knows about a learner from valid_from until valid_to. **Learner.** A person
    the university has recorded learning with it, in any of its systems: a student of an award, a learning
    platform user, or a short-course customer. - Business key: The student ID, qualified by its key set:
    SIS|S-20417. A learner the student system doesn''t know keeps the key of the first system that recorded
    them, the learning platform first on a tie (LMS|u-88260, SC|grace.okafor@mail.example), until they''re
    matched to a student ID. Issued by: Registrar''s office. - Owner of the meaning: Mei Tanaka, registrar''s
    office. - Identity: A student ID is a learner. - Identity: A learning platform account is the learner
    whose student ID it holds. - Identity: An account or a short-course customer with no student ID is
    the learner whose email it shares, if exactly one student has that email. - Identity: A short-course
    customer can also be the learner of a platform account with the same email, if exactly one has it.
    - Identity: Anything left is a learner of its own. - Identity: A learner with no student ID keeps
    the key of the first system that recorded them, whatever keys join them later. - Identity: A recorded
    decision beats every rule; a decision that two keys are different people stops any rule from matching
    them. - History: Every version, dated when it took effect where the source says so, and when it was
    recorded otherwise. - Not in the business glossary: data governance confirmed there''s no term for
    it, on 2026-10-20.'
  properties:
  - name: learner_key
    logicalType: string
    physicalType: string
    required: true
    classification: pseudonymous
    primaryKey: true
    primaryKeyPosition: 1
    description: 'The learner''s hash key: the sha-256 of `learner_bk`, as 64 hex characters. The same
      learner has the same key in every model, on every engine.'
  - name: learner_bk
    logicalType: string
    physicalType: string
    required: true
    classification: direct
    description: 'The learner''s business key, readable and qualified by its key set: `SIS|S-20417` for
      a learner with a student ID; `LMS|u-...` or `SC|email` for a learner the student system doesn''t
      know. Contains a student ID or an email: personal data.'
  - name: valid_from
    logicalType: date
    physicalType: date
    required: true
    classification: none
    primaryKey: true
    primaryKeyPosition: 2
    description: The first day this version was true, inclusive. Where the source says when a change took
      effect, that date; otherwise the day the platform recorded it.
  - name: valid_to
    logicalType: date
    physicalType: date
    required: false
    classification: none
    description: The first day this version was no longer true, exclusive. Null for the last version.
  - name: is_current
    logicalType: boolean
    physicalType: boolean
    required: true
    classification: none
    description: 'True for the version valid on the day of the build (or the `as_is_date` var): as it
      is now. A change dated in the future isn''t current until its day.'
  - name: recorded_at
    logicalType: timestamp
    physicalType: timestamp
    required: false
    classification: none
    description: 'When the platform recorded the latest change behind this version. It can be later than
      `valid_from`: a withdrawal entered a week after it happened is valid from the day it happened.'
  - name: full_name
    logicalType: string
    physicalType: string
    required: false
    classification: direct
    description: The learner's name, from the student system if it knows them, then the learning platform,
      then short courses.
  - name: email
    logicalType: string
    physicalType: string
    required: false
    classification: direct
    description: The learner's email, lower case, from the same systems in the same order.
  - name: status
    logicalType: string
    physicalType: string
    required: false
    classification: none
    description: 'The learner''s status, in the canonical set: `studying`, `inactive`, `withdrawn` or
      `completed`. Each system''s own codes (ENR, active, 1, ...) are mapped in `seeds/reference/student/status_map.csv`,
      owned by the registrar''s office. The student system''s status wins over the platforms''.'
    quality:
    - id: accepted_values_core_learner_v1_status__studying__inactive__withdrawn__completed
      metric: invalidValues
      mustBe: 0
      unit: rows
      arguments:
        validValues:
        - studying
        - inactive
        - withdrawn
        - completed
      dimension: conformity
      severity: error
  - name: enrolled_award_key
    logicalType: string
    physicalType: string
    required: false
    classification: none
    description: The award the learner is enrolled in, in the student system. Null for learners it doesn't
      know.
    quality:
    - id: relationships_core_learner_v1_enrolled_award_key__award_key__ref_core_award_
      type: custom
      engine: dbt
      implementation: 'relationships: relationships_core_learner_v1_enrolled_award_key__award_key__ref_core_award_'
      dimension: consistency
      severity: error
  - name: enrolled_award_bk
    logicalType: string
    physicalType: string
    required: false
    classification: none
    description: 'The award''s business key, readable and qualified by its key set: `SIS|GCDA`.'
  - name: key_set
    logicalType: string
    physicalType: string
    required: false
    classification: none
    description: 'The key set of the learner''s business key: `SIS` for every learner with a student ID.'
  - name: keys_held
    logicalType: integer
    physicalType: int
    required: false
    classification: none
    description: How many keys, across the three systems, belong to the learner.
  - name: has_student_id
    logicalType: boolean
    physicalType: boolean
    required: false
    classification: none
    description: True when the student system knows the learner.
  quality:
  - id: unique_combination_core_learner_v1_learner_key__valid_from
    type: custom
    engine: dbt
    implementation: 'unique_combination: unique_combination_core_learner_v1_learner_key__valid_from'
    dimension: uniqueness
    severity: error
  - id: versions_do_not_overlap_core_learner_v1_learner_key
