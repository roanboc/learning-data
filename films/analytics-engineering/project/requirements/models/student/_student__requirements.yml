# The student domain's requirements: what its entities mean and how they're modelled. The schema is
# in requirements/README.md.
scope:
  kind: domain
  name: student
  code: STU

items:

  - id: DEC-STU-01
    type: decision
    step: scope
    title: A microcredential is a kind of credential
    text: A microcredential is a kind of credential, not an entity of its own. So is a badge.
    why: >
      Same identity (the issuer's identifier) and the same lifecycle (issued, maybe revoked). Only
      the credit points differ.
    decided_by: Mei Tanaka, registrar's office
    decided_on: 2026-10-02
    status: delivered

  - id: DEC-STU-02
    type: decision
    step: scope
    title: A certificate of attendance isn't a credential
    text: A certificate of attendance isn't a credential.
    why: It says someone was there, not what they can do.
    decided_by: Mei Tanaka, registrar's office
    decided_on: 2026-10-02
    status: delivered
    relates_to: [GAP-SC-03]

  - id: DEC-STU-03
    type: decision
    step: source_reality
    title: The learner's business key is the student ID
    text: >
      The learner's business key is the student ID, which the registrar's office issues. A learner
      the student system doesn't know keeps the key of the first system that knew them.
    why: >
      The student system is the system of record for learners. Short-course customers and
      platform-only learners still need a key.
    decided_by: Mei Tanaka and Noor
    decided_on: 2026-10-05
    status: delivered
    relates_to: [DEC-PRJ-01, LIM-STU-02]

  - id: DEC-STU-04
    type: decision
    step: source_reality
    title: Keys are matched by rules; a person's decision beats them
    text: >
      Keys are matched by rules, most trusted first. A person's recorded decision beats every
      rule, and a decision that two keys are different people stops any rule from matching them.
    why: >
      An email two people share, or a student ID typed wrong, would merge two learners. Some
      matches only a person can make.
    decided_by: Mei Tanaka, registrar's office
    decided_on: 2026-10-06
    status: delivered
    implemented_in: [int_learner_key_candidates, int_learner_keys_matched, learner_identity_decisions]
    relates_to: [GAP-SIS-01, GAP-LMS-02]

  - id: DEC-STU-05
    type: decision
    step: scope
    title: Credit counts from release or issue, every change a version
    text: >
      Credit counts from the day a result is released or a credential issued, until it's amended
      or revoked; every change is a new version.
    why: '"As at census" needs the credit held on that day, not today.'
    decided_by: Mei Tanaka, registrar's office
    decided_on: 2026-10-08
    status: delivered
    implemented_in: [int_credit_towards_award]

  - id: DEC-STU-06
    type: decision
    step: scope
    title: A credential keeps its whole life
    text: >
      A credential keeps its whole life: issued on a date, revoked on a date, read from every
      version the source kept. A revoked credential stays, marked revoked.
    why: >
      "As at census" needs what counted then, even if it was revoked since; the wallet shows a
      revoked credential as revoked, not gone.
    decided_by: Mei Tanaka, registrar's office
    decided_on: 2026-10-08
    status: delivered
    implemented_in: [int_credentials_unioned, core_credential]

  - id: DEC-STU-07
    type: decision
    step: operate_and_evolve
    title: core_credential version 2 replaces is_revoked with status
    text: >
      core_credential version 2 replaces is_revoked with status (valid, expired or revoked).
      Version 1 stays until 31 March 2027, built from version 2.
    why: >
      A credential can also expire, and a true/false can't say so. Consumers get time to move; the
      exposures say who to tell.
    decided_by: Noor and Mei Tanaka
    decided_on: 2026-10-13
    informed: [Wallet app team]
    status: delivered
    implemented_in: [core_credential]
    relates_to: [DEC-PRJ-02, GAP-STU-02]

  - id: GAP-STU-01
    type: gap
    step: gaps_and_contracts
    title: Three status code sets
    expectation: A status means the same thing everywhere.
    reality: "Three code sets: ENR, LOA, WD, CMP; active, inactive; 1, 0."
    resolution: [rule_in_model]
    text: One canonical set, mapped in seeds/reference/student/status_map.csv, owned by the registrar's office.
    owner: Mei Tanaka, registrar's office
    status: delivered
    sources: [student_system, learning_platform, short_courses]
    evidence: [analyses/profiling/profile_value_sets.sql]
    implemented_in: [int_learner_timeline, status_map]

  - id: GAP-STU-02
    type: gap
    step: gaps_and_contracts
    title: No source records an expiry
    expectation: A credential can expire.
    reality: No source records an expiry.
    resolution: [accept]
    text: status allows expired; nothing sets it yet.
    owner: Mei Tanaka, registrar's office
    status: agreed
    implemented_in: [core_credential]

  - id: LIM-STU-01
    type: limitation
    step: gaps_and_contracts
    title: Revocation dates are the day a source stopped showing a credential as held
    text: >
      A badge: the day the platform stopped showing it. A short-course certificate: the day its
      enrolment stopped being completed. An award: the day a later record of the same award
      stopped being completed. It may have been revoked earlier, and a badge deleted for another
      reason also counts as revoked.
    status: agreed
    relates_to: [GAP-LMS-01]

  - id: LIM-STU-02
    type: limitation
    step: gaps_and_contracts
    title: A learner the student system doesn't know keeps the key of the first system that recorded them
    text: >
      The learning platform comes first on a tie. The key changes only when they're matched to a
      student ID, by a rule (a student ID in their platform account, an email only one student
      has) or by the registrar's office. Their old key stays in int_learner_keys.
    status: agreed
    relates_to: [DEC-STU-03]

  - id: LIM-STU-03
    type: limitation
    step: gaps_and_contracts
    title: A learner with two keys in one system gets one value per attribute
    text: Two platform accounts, or two short-course emails - on each date, that system's version recorded last wins.
    status: agreed

  - id: LIM-STU-04
    type: limitation
    step: gaps_and_contracts
    title: Units count only towards the award they were taken under
    text: Credit moved between awards when a learner changes award is outside this slice.
    status: agreed

  - id: LIM-STU-05
    type: limitation
    step: operate_and_evolve
    title: An incremental run re-merges only what changed
    text: >
      core_credential merges credentials whose source rows were written since the last run, and
      credentials whose holder was matched to another learner. A change to the model's logic
      reaches existing rows only with --full-refresh.
    status: agreed
    implemented_in: [core_credential]

  - id: DEC-STU-08
    type: decision
    step: build
    title: core_credential version 2 is incremental, merged on credential_key
    text: core_credential version 2 is incremental, merged on credential_key, on both engines.
    why: One strategy, merge, that both engines support.
    status: delivered
    implemented_in: [core_credential]
    relates_to: [LIM-STU-05]
