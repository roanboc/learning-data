# Who each owner the project's metadata names is, and how a change reaches them. The metadata names
# owners as people and offices know them ("Mei Tanaka, registrar's office"); this says where the
# impact check's note goes. Owners decide what their data means in the glossary, before any code,
# and are told what a change touches; they don't review pull requests. The data team does
# (scripts/generate/codeowners.py, CODEOWNERS).
#
# Every owner the metadata names must be here, or the generator fails. The emails are the
