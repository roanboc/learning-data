sources:
  - name: exam_boards
    description: '{{ doc("source_exam_boards") }}'
    database: "{{ env_var('DBT_SOURCES_CATALOG', target.database) }}"
    schema: "{{ env_var('DBT_SOURCES_SCHEMA_PREFIX', '') }}exam_boards"
    config:
      # Read by dbt-duckdb only: on DuckDB each table is a CSV file in data/. Databricks reads the ingested table.
      external_location: "read_csv('data/exam_boards/{name}.csv', header = true, all_varchar = true)"
      # on DuckDB the column is text; on Databricks the cast does nothing
      loaded_at_field: "cast(_loaded_at as timestamp)"
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 3, period: day}
      meta:
        owner: "Registrar's office, with the faculties"
        key_set:
          code: EB
          system: exam boards' register
          owner: "Registrar's office, with the faculties"
          # The day the project first read this system's keys: the key sets seed lists them in that order.
          since: 2026-11-10
          # Each key the system issues, and the case staging writes it in (docs/conventions.md).
          system_keys:
            - {key: approval_id, case: upper, example: EB-26-0412}
          example: EB|EB-26-0412
        domain: registrar
    tables:
      - name: approved_awards
        description: >
          One row per version of an award a faculty's exam board approved: the graduate, the award
          and the day the board approved it, the conferral date printed on the certificate. The
          board's secretary records each approval from the meeting's own decision, never from the
          student system. The system key is the approval ID.
        config:
          meta:
            system_key: [approval_id]
            limitations:
              - id: LIM-EB-01
                text: >
                  A slice: the approvals of the graduates in the student system's slice of the list
                  (LIM-SIS-02), not every approval the boards made.
        columns:
          - name: approval_id
            description: The ID the boards' register gives each approval, like EB-26-0412.
          - name: student_id
            description: The graduate, by the student ID the student system issued, as the board's list names them.
          - name: award_code
            description: The award the board approved, by its code in the student system, like MDA.
          - name: approved_on
            description: The day the board approved the award at its meeting, printed on the certificate as the conferral date.
          - name: faculty_code
            description: The faculty whose exam board approved the award, like EIT.
