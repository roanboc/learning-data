name: credentials
version: "1.0.0"
profile: credentials

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
# Doc blocks live with the domain that owns them, in models/. docs/ holds the process, not definitions.
docs-paths: ["models"]
clean-targets: ["target", "logs"]

# Stated once, used everywhere. Override one for a run with --vars.
vars:
  census_date: "2026-03-31"          # Planning's census date: the "as at" of the Planning mart
  as_is_date: null                   # the "now" of the wallet marts; null means the day of the build
  near_award_credit_points: 15       # "within 15 credit points" of an award
  microcredentials_per_award: 4      # an award accepts up to four microcredentials towards its credit
  passing_grades: ["P", "C", "D", "HD"]

models:
  credentials:
    # Databricks only: push descriptions to Unity Catalog. DuckDB leaves them in the docs site.
    +persist_docs:
      relation: "{{ target.type == 'databricks' }}"
      columns: "{{ target.type == 'databricks' }}"

    staging:
      +materialized: view
      +schema: staging
      +group: credential_model
      +access: private

    intermediate:
      +materialized: view
      +schema: intermediate
      +group: credential_model
      +access: private

    # Core and intermediate are split by domain (core/student/, core/course/), following the
    # reference model, TCSI. Staging is split by source system; marts by consumer.
    core:
      +materialized: table
      +schema: core
      +group: credential_model
      +access: public
      +contract:
        enforced: true

    marts:
      +materialized: table
      +schema: marts
      +access: protected
      +contract:
        enforced: true
      planning:
        +group: planning
        # Who can read, as opposed to who can ref() (access, above). Databricks only, when the
        # var planning_readers names Unity Catalog groups: --vars '{planning_readers: [planning_analysts]}'.
        +grants: "{{ {'select': var('planning_readers')} if target.type == 'databricks' and var('planning_readers', none) else {} }}"
      wallet:
        +group: wallet

    # What every domain uses. Today: the time spine every metric needs. Planning's semantic model
    # and metrics live with its marts.
    _shared:
      +materialized: table
      +schema: shared
      +group: credential_model
      +access: protected

# Seeds are split by purpose first, then by domain. Never mix the two purposes in one folder.
seeds:
  credentials:
    # Reference data the business owns: mappings, decisions, key sets. Models join to it.
    reference:
      +schema: reference
      +group: credential_model
      +tags: ["reference"]
    # Expected values: numbers published outside this project, that tests and reconciliations
    # compare against. No model may ref() them.
    expected:
      +schema: expected
      +tags: ["expected"]
      planning:
        +group: planning
