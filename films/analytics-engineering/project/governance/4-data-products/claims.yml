# A data product: what it's for, who answers for it, what it promises and to whom. Written by hand,
# owned by its owner. scripts/generate/products.py writes its product descriptor and a data contract
# for each output, from this file and the dbt contracts.

name: claims
title: Claims
owner: HR
domain: staff
status: active
version: 1.0.0
description:
  purpose: The claims casual staff make for the hours they worked, as they stand now in the claims app,
    with the pay type and teaching period of the contract each is claimed under.
  usage: Pin the version you read. Join on claim_key. Read where the app writes them, with nothing copied;
    staff_bk is direct personal data, masked on Databricks for anyone not allowed to see it.
outputs:
  - {model: core_claim, version: 1}
service_levels:
  - {property: latency, value: 0, unit: d, description: "Read in place, so it's as current as the claims app."}
support:
  - {channel: payroll-data, tool: email, url: "mailto:hr@uni.example", scope: issues}
