models:

  - name: mart_planning__near_award
    description: >
      Every award a learner was enrolled in, or held credit towards, on the census date, with
      the credit they held and how far they were from it. As it was: every entity is read at
      its version on the census date, so a change recorded later, dated after census, doesn't
      change the answer. No names or emails: Planning counts learners, it doesn't need to know
      who they are.
    config:
      meta:
        grain: One row per learner per award, as at census date
        glossary_term: near_award
        owner: Planning
        domain: planning
        consumer: Census dashboard
        limitations:
          - id: LIM-PLN-01
            text: >
              The Planning mart applies identity as it's known today to the census date. The
              census team matched two learners by hand before publishing on 14 April 2026; the
              registrar's office recorded the same matches as identity decisions D-001 and D-002
              in October. Without those decisions, the mart counts 10 learners, not 12, and the
              reconciliation fails.
    constraints:
      - type: primary_key
        name: pk_mart_planning__near_award
        columns: [learner_award_key]
        warn_unenforced: false
    data_tests:
      # the grain, tested as a key
      - unique_combination:
          arguments:
            columns: [learner_key, award_key]
    columns:
      - name: learner_award_key
        description: '{{ doc("learner_award_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        data_tests: [unique]
        config:
          meta: {personal_data: pseudonymous}
      - name: census_date
        description: '{{ doc("census_date") }}'
        data_type: date
        constraints: [{type: not_null}]
        config: {meta: {personal_data: none}}
      - name: learner_key
        description: '{{ doc("learner_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('core_learner')
                field: learner_key
        config:
          meta: {glossary_term: learner, personal_data: pseudonymous}
      - name: award_key
        description: '{{ doc("award_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        config:
          meta: {glossary_term: award, personal_data: none}
      - name: award_code
        description: '{{ doc("award_code") }}'
        data_type: string
        config: {meta: {personal_data: none}}
      - name: award_name
        description: '{{ doc("award_name") }} On the census date.'
        data_type: string
        config: {meta: {personal_data: none}}
      - name: award_type
        description: '{{ doc("award_type") }}'
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [graduate certificate, master]
        config: {meta: {personal_data: none}}
      - name: faculty_code
        description: '{{ doc("faculty_code") }}'
        data_type: string
        constraints: [{type: not_null}]
        config: {meta: {personal_data: none}}
      - name: faculty_name
        description: '{{ doc("faculty_name") }}'
        data_type: string
        config: {meta: {personal_data: none}}
      - name: learner_status
        description: '{{ doc("learner_status") }} On the census date.'
        data_type: string
        config: {meta: {personal_data: none}}
      - name: is_enrolled
        description: True when the learner was enrolled in this award on the census date.
        data_type: boolean
        constraints: [{type: not_null}]
        config: {meta: {personal_data: none}}
      - name: credit_points_required
        description: '{{ doc("credit_points_required") }}'
        data_type: int
        config: {meta: {personal_data: none}}
      - name: credit_points_from_units
        description: '{{ doc("credit_points_from_units") }} On the census date.'
        data_type: int
        config: {meta: {personal_data: none}}
      - name: credit_points_from_microcredentials
        description: '{{ doc("credit_points_from_microcredentials") }} On the census date.'
        data_type: int
        config: {meta: {personal_data: none}}
      - name: credit_points_earned
        description: '{{ doc("credit_points_earned") }} On the census date.'
        data_type: int
        constraints: [{type: not_null}]
        config: {meta: {personal_data: none}}
      - name: credit_points_remaining
        description: '{{ doc("credit_points_remaining") }}'
        data_type: int
        constraints: [{type: not_null}]
        config: {meta: {personal_data: none}}
      - name: is_near_award
        description: >
          True when, on the census date, the learner was studying, enrolled in this award, and
          within the var near_award_credit_points of it: more than none left, and no more than
          that many.
        data_type: boolean
        config:
          meta: {glossary_term: near_award, personal_data: none}
        constraints: [{type: not_null}]
      - name: is_commencing
        description: >
          True when the learner was a commencing student in this award on the census date.
          {{ doc("commencing_student") }}
        data_type: boolean
        constraints: [{type: not_null}]
        config:
          meta: {glossary_term: commencing_student, personal_data: none}

unit_tests:

  - name: commencing_means_started_for_the_first_time_this_year
    description: >
      Four learners studying the same graduate certificate on census day, 31 March 2026. One
      started it this year: commencing. One came back to it after leave: not commencing. One
      finished a master last year and started the certificate this year: commencing, in the
      certificate. One started it last year: not commencing.
    model: mart_planning__near_award
    given:
      - input: ref('core_learner')
        format: csv
        rows: |
          learner_key,learner_bk,status,enrolled_award_key,valid_from,valid_to
          L1,SIS|S-1,studying,A1,2026-02-23,
          L2,SIS|S-2,studying,A1,2025-02-24,2025-08-01
          L2,SIS|S-2,inactive,A1,2025-08-01,2026-02-23
          L2,SIS|S-2,studying,A1,2026-02-23,
          L3,SIS|S-3,studying,A2,2024-02-26,2025-12-10
          L3,SIS|S-3,completed,A2,2025-12-10,2026-02-23
          L3,SIS|S-3,studying,A1,2026-02-23,
          L4,SIS|S-4,studying,A1,2025-02-24,
      - input: ref('core_award')
        format: csv
        rows: |
          award_key,award_bk,award_code,award_name,award_type,faculty_code,faculty_name,credit_points_required,valid_from,valid_to
          A1,SIS|GC,GC,A graduate certificate,graduate certificate,EIT,Faculty of Engineering and IT,60,2024-01-01,
          A2,SIS|M,M,A master,master,EIT,Faculty of Engineering and IT,120,2024-01-01,
      - input: ref('core_credit_towards_award')
        format: csv
        rows: |
          learner_key,award_key,credit_points_from_units,credit_points_from_microcredentials,credit_points_earned,valid_from,valid_to
          L4,A1,30,0,30,2025-12-01,
    expect:
      format: csv
      rows: |
        learner_key,award_key,is_commencing
        L1,A1,true
        L2,A1,false
        L3,A1,true
        L4,A1,false
