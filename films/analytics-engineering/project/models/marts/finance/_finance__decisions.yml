# Decisions about the finance consumer: what was decided, why, and who decided.
# Permanent: a decision is never deleted; a replaced one is marked superseded and relates to
# what replaced it. The schema is in requirements/README.md, and docs/decisions.md indexes
# every log. Not parsed by dbt (.dbtignore).

scope: {kind: consumer, name: finance, code: FIN}

decisions:

  - id: DEC-FIN-01
    step: scope
    title: Recognised credit only, on the public core
    text: Finance's question counts recognised credit only, from microcredentials and short-course
      certificates; units passed are paid for. It reads the public core, and touches no other domain.
    why: Only recognised credit saves tuition. A new consumer builds on what the core publishes, so no
      other team's work changes.
    decided_by: Finance, with Noor, data architect
    decided_on: 2026-10-19
    status: agreed

  - id: DEC-FIN-02
    step: consumer_output
    title: Tuition is saved in the enrolled award only
    text: Recognised credit saves tuition only in the award the learner is enrolled in on census day,
      counted once, at that award's published rate for the census year.
    why: The core counts recognised credit towards every award it could count towards. A learner pays
      tuition for one award; counted across all of them, the saving would be two or three times too big.
    decided_by: Finance
    decided_on: 2026-10-21
    status: agreed
    was: Q-FIN-01

  - id: DEC-FIN-03
    step: gaps_and_contracts
    title: The published rate, not what each learner was charged
    text: Tuition forgone is worked out at the published rate per credit point. Scholarships,
      discounts and fee waivers aren't in; Finance adjusts for them in the forecast. Accepted as
      LIM-FIN-01, on the mart.
    why: No source in the project holds what each learner was charged. The forecast needs the
      published price; the adjustments are Finance's own, and change every year.
    decided_by: Finance
    decided_on: 2026-10-22
    status: agreed
    implemented_in: [mart_finance__tuition_forgone]
    relates_to: [LIM-FIN-01]

  - id: DEC-FIN-04
    step: consumer_output
    title: Payroll's export is a model in the project, counted by the pay day that pays each claim
    text: Payroll's export to Finance is mart_finance__casual_pay_paid, built from the claims approved in the
      claims app. Each approved claim is paid on the first pay day whose claims close at or after its
      approval (pay_day_for(), on HR's calendar, pay_days), and the export counts pay days up to the day
      of the build. Totals by pay day, faculty and unit, with no names or IDs. Accepted as LIM-FIN-02 and
      LIM-FIN-03, on the mart.
    why: The export ran for years as a script on one person's laptop, with payroll's rule inside it, and
      when the claims moved into the claims app nobody could change it safely. As a model, the rule is
      written once with its owner, tested before every change, and reviewed by someone other than its
      author.
    decided_by: Ingrid Holm, HR, with Rohan Desai, Finance
    decided_on: 2026-03-04
    status: agreed
    implemented_in: [mart_finance__casual_pay_paid, pay_day.sql]
    relates_to: [DEC-PRJ-16, LIM-FIN-02, LIM-FIN-03]
