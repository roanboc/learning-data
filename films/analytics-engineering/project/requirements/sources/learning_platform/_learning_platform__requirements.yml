# What's still open about the learning_platform source: watched until it's done, then deleted.
# The schema is in requirements/README.md.

scope: {kind: source, name: learning_platform, code: LMS}

items:

  - id: GAP-LMS-01
    type: gap
    step: gaps_and_contracts
    title: No revocation flag
    expectation: A revoked credential is known as revoked.
    reality: The learning platform has no revocation flag. It deletes a revoked badge.
    resolution: [fix_at_source]
    text: A revocation flag and date, requested from the learning team.
    owner: Learning team
    status: in_progress
    done_when: The platform sends a revocation flag and date; staging reads them, and DEC-LMS-01's rule
      is retired.
    relates_to: [DEC-LMS-01, LIM-STU-01]

  - id: GAP-LMS-02
    type: gap
    step: gaps_and_contracts
    title: Accounts without a student ID
    expectation: Every learning platform account names its student.
    reality: Staff type the student ID in. 4 of 42 current accounts have none (analyses/profiling/profile_null_keys.sql);
      one holds another student's ID.
    resolution: [fix_at_source]
    text: A check of the student ID against the student system, requested from the learning team.
    owner: Learning team
    status: in_progress
    done_when: profile_null_keys.sql finds no current account without a student ID, and none holds another
      student's ID.
    evidence: [analyses/profiling/profile_null_keys.sql]
    relates_to: [DEC-LMS-02, DEC-STU-04]
