# Run explicitly after committing new audio.json pointers. Audio releases are prereleases,
# so they never replace the video release used by the site's latest-download links.
name: Store audio outside Git

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New immutable audio release tag (first migration: audio-v1)"
        required: true
        default: audio-v1

permissions:
  contents: read

concurrency:
  group: audio-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare checksum-named audio
        env:
          TAG: ${{ inputs.tag }}
        run: python site-tools/media.py prepare --tag "$TAG" --output "$RUNNER_TEMP/audio"
      - name: Publish a new immutable audio release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/audio/"*.mp3 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Published audio: $TAG" \
            --notes "Checksum-named audio referenced by each film's audio.json. Keep these assets immutable."
      - name: Verify every uploaded replacement
        run: python site-tools/media.py verify-remote
