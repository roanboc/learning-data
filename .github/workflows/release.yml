                       "films/inner-life-of-data/source/src", "films/inner-life-of-data/source/fonts"]},
            {"name": "Who owns what", "key": "who-owns-what-en",
             "dir": "films/analytics-engineering/7-who-owns-what/source", "lang": "en",
             "player": "dist/film.js", "site_player": "site/assets/who-owns-what/film.js",
             "video": "dist/who-owns-what.mp4", "file": "who-owns-what.mp4",
             "captions": [["films/analytics-engineering/7-who-owns-what/captions/en.srt", "who-owns-what.en.srt"], ["films/analytics-engineering/7-who-owns-what/captions/es.srt", "who-owns-what.es.srt"]],
             "paths": ["films/analytics-engineering/7-who-owns-what/source", ":(exclude)films/analytics-engineering/7-who-owns-what/source/src/i18n/es/captions.js", "films/analytics-engineering/shared",
                       "films/from-words-to-data/shared", "films/from-words-to-data/7-keeping-it-true/source/src/true.js",
                       "films/when-things-go-wrong/characters", "films/when-things-go-wrong/1-silent-change/source/src",
                       "films/a-sharper-sketch/source/src",
                       "films/inner-life-of-data/source/src", "films/inner-life-of-data/source/fonts"]},
            {"name": "An agent on the team", "key": "an-agent-on-the-team-en",
             "dir": "films/analytics-engineering/8-an-agent-on-the-team/source", "lang": "en",
             "player": "dist/film.js", "site_player": "site/assets/an-agent-on-the-team/film.js",
             "video": "dist/an-agent-on-the-team.mp4", "file": "an-agent-on-the-team.mp4",
             "captions": [["films/analytics-engineering/8-an-agent-on-the-team/captions/en.srt", "an-agent-on-the-team.en.srt"], ["films/analytics-engineering/8-an-agent-on-the-team/captions/es.srt", "an-agent-on-the-team.es.srt"]],
             "paths": ["films/analytics-engineering/8-an-agent-on-the-team/source", ":(exclude)films/analytics-engineering/8-an-agent-on-the-team/source/src/i18n/es/captions.js", "films/analytics-engineering/shared",
                       "films/from-words-to-data/shared", "films/from-words-to-data/7-keeping-it-true/source/src/true.js",
                       "films/when-things-go-wrong/characters", "films/when-things-go-wrong/1-silent-change/source/src",
                       "films/a-sharper-sketch/source/src",
                       "films/inner-life-of-data/source/src", "films/inner-life-of-data/source/fonts"]},
            {"name": "Written once", "key": "written-once-en",
             "dir": "films/analytics-engineering/9-written-once/source", "lang": "en",
             "player": "dist/film.js", "site_player": "site/assets/written-once/film.js",
             "video": "dist/written-once.mp4", "file": "written-once.mp4",
             "captions": [["films/analytics-engineering/9-written-once/captions/en.srt", "written-once.en.srt"], ["films/analytics-engineering/9-written-once/captions/es.srt", "written-once.es.srt"]],
             "paths": ["films/analytics-engineering/9-written-once/source", ":(exclude)films/analytics-engineering/9-written-once/source/src/i18n/es/captions.js", "films/analytics-engineering/shared",
                       "films/from-words-to-data/shared", "films/from-words-to-data/7-keeping-it-true/source/src/true.js",
                       "films/when-things-go-wrong/characters", "films/when-things-go-wrong/1-silent-change/source/src",
                       "films/a-sharper-sketch/source/src",
                       "films/inner-life-of-data/source/src", "films/inner-life-of-data/source/fonts"]}
          ]
          EOF
          python3 .github/scripts/plan.py films.json "$CHOICE"

      - uses: actions/upload-artifact@v7
        with:
          name: films
          path: films.json
          retention-days: 3

  render:
    name: Render (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      FILM_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt

      - name: Install the tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Every film uses the first film's voice model, from films/inner-life-of-data/source/models.
      - name: Restore the voice model
        uses: actions/cache@v6
        with:
          path: films/inner-life-of-data/source/models
          key: kokoro-model-files-v1.0

      - name: Download the voice model
        working-directory: films/inner-life-of-data/source
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "models/$f" ] || curl -fsSL --retry 3 -o "models/$f" "$base/$f"
          done

      # Keeps the committed timings, so the video, the site's player and the captions share one timeline.
      - name: Voice the narration
        run: python tools/tts.py --keep-timings

      - name: Build the player
        run: python tools/build.py

      - name: Check that the site plays this film
        env:
          PLAYER: ${{ matrix.player }}
          SITE_PLAYER: ${{ github.workspace }}/${{ matrix.site_player }}
        run: |
          if ! cmp -s "$PLAYER" "$SITE_PLAYER"; then
            echo "::error title=The site plays an older film::Build the film and copy $PLAYER to ${{ matrix.site_player }}, as the film's source README says, then run this again."
            exit 1
          fi
          echo "The site's player is built from this source."

      - name: Check that every moment draws
        run: python tools/check.py

      - name: Mix the soundtrack
        run: python tools/audio.py

      - name: Build the player with the soundtrack
        run: python tools/build.py

      - name: Render the video
        run: python tools/render.py --workers "$(nproc)"

      - name: Add the pacing report to the summary
        run: |
          {
            echo "### Pacing: ${{ matrix.name }}"
            echo '```'
            python tools/pace.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: video-${{ matrix.key }}
          path: ${{ matrix.dir }}/${{ matrix.video }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [plan, render]
    # runs when the renders all passed, or when there was nothing to render (a new tag still gets every film)
    if: always() && needs.plan.result == 'success' && (needs.render.result == 'success' || needs.render.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: films
          path: .

      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.count != '0'
        with:
          pattern: video-*
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          RENDERED: ${{ needs.plan.outputs.films }}
        run: |
          mkdir -p out
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          target=$(gh release view "$TAG" --json tagName --jq .tagName 2>/dev/null || true)
          # every caption file, from this commit: they sit beside the videos, which have no captions on the picture
          jq -r '.[] | .captions[] | @tsv' films.json | while IFS=$'\t' read -r captions srt; do cp "$captions" "out/$srt"; done
          # every video: rendered now, or else carried over from this tag (running it again) or from the latest release
          while IFS=$'\t' read -r key file; do
            [ -f "out/$file" ] && { echo "- $file: rendered from this commit" >> summary.md; continue; }
            for from in $target $latest; do
              if gh release download "$from" -p "$file" -D out --clobber 2>/dev/null; then
                echo "- $file: carried over from release $from" >> summary.md; break
              fi
            done
            if [ ! -f "out/$file" ]; then
              echo "::error title=No video for $key::$file wasn't rendered and isn't in an earlier release. Run this again with films set to $key, or to all."
              exit 1
            fi
          done < <(jq -r '.[] | [.key, .file] | @tsv' films.json)
          ls -l out
          { echo "### Videos in release $TAG"; cat summary.md; } >> "$GITHUB_STEP_SUMMARY"
          cat > notes.md <<EOF
          The Learning Data films. Each video is 1080p, with no captions on the picture: its captions come beside it as \`.srt\` files, one per language, for the platform or player to show. Upload the one you want with the video.

          - *The Inner Life of Data*, how a modern data platform works: \`inner-life-of-data.mp4\` (English) and \`inner-life-of-data.es.mp4\` (Latin American Spanish, *La vida interior de los datos*).
          - *A Sharper Sketch*, data modelling: \`a-sharper-sketch.mp4\` (English, with English and Spanish captions).
          - *Silent change*, from the series *When things go wrong*, on changes and data contracts: \`silent-change.mp4\` (English, with English and Spanish captions).
          - *Too good to be true*, from the series *When things go wrong*, on data quality checks: \`too-good-to-be-true.mp4\` (English, with English and Spanish captions).
          - *Data for Films* and *That's not quite right*, the Making of films, on how the films are drawn and how they're made: \`data-for-films.mp4\` and \`thats-not-quite-right.mp4\` (English, with English and Spanish captions).
          - *From words to data*, seven films on data modelling, from language and meaning to keeping it true with AI: \`whats-in-a-word.mp4\`, \`older-than-the-systems.mp4\`, \`built-to-write-built-to-read.mp4\`, \`many-ways-to-read.mp4\`, \`both-at-once.mp4\`, \`meaning-machines-can-read.mp4\`, \`keeping-it-true.mp4\` (English, with English and Spanish captions).

          Rendered for this release, from commit $GITHUB_SHA: ${RENDERED:-none; every video is carried over from the previous release}.

          Watch them with chapters, then try the hands-on labs and scenarios: https://roanboc.github.io/learning-data/

          The narration is a synthetic voice. The university, people and numbers are fictional. The films are licensed CC BY 4.0; the Databricks and dbt logos belong to their owners (see NOTICE.md).
          EOF
          if [ -n "$target" ]; then
            gh release upload "$TAG" out/* --clobber
            echo "Replaced the files of release $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            draft=(); [ "$DRAFT" = true ] && draft=(--draft)
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Learning Data films · $TAG" --notes-file notes.md "${draft[@]}"
            if [ "$DRAFT" = true ]; then echo "Saved release $TAG as a draft: publish it under Releases when the videos look right." >> "$GITHUB_STEP_SUMMARY"; else echo "Published release $TAG." >> "$GITHUB_STEP_SUMMARY"; fi
          fi
