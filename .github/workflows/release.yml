# Renders the films (the topic films and the two Making of films) and publishes the videos and captions to one GitHub release.
# Run it by hand: Actions → Render and release the films → Run workflow.
#
# Which films to render (the "films" input):
#   changed  (the default) only the films whose source changed since the latest release, including shared code
#            such as the first film's engine, which every film draws with. Nothing changed: nothing is rendered.
#   all      every film, in about 30 to 45 minutes; the films render at the same time.
#   a list   keys separated by commas, such as silent-change-en,too-good-to-be-true-en (the keys are in FILMS below).
# Every release still carries every film: the videos that aren't rendered are copied from the latest release,
# so the site's download buttons, which point to the latest release, always find each file.
# See films/inner-life-of-data/source/README.md, section Publish.
name: Render and release the films

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Use a new tag for a new version; running again with the same tag replaces its files.
        required: true
        default: v2.0
      films:
        description: "Which films to render: changed (since the latest release), all, or keys separated by commas, such as silent-change-en"
        required: true
        default: changed
      draft:
        description: Save a new release as a draft, to watch the videos before the download buttons point to them.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-film
  cancel-in-progress: false

jobs:
  plan:
    name: Choose the films to render
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      films: ${{ steps.plan.outputs.films }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHOICE: ${{ inputs.films }}
        # FILMS: one entry per video. "captions" are its caption files, published beside it: the video has no captions on the picture.
        # "paths" lists everything the video is built from: its own source, and the shared code it draws with. A change under any of
        # them means the video needs rendering again; captions only (the files, and src/i18n/<lang>/captions.js) never change the picture.
        run: |
          cat > films.json <<'EOF'
          [
            {"name": "The Inner Life of Data, English", "key": "inner-life-of-data-en",
             "dir": "films/inner-life-of-data/source", "lang": "en",
             "player": "dist/film.js", "site_player": "site/assets/film/film.js",
             "video": "dist/inner-life-of-data.mp4", "file": "inner-life-of-data.mp4",
             "captions": [["films/inner-life-of-data/captions/en.srt", "inner-life-of-data.en.srt"]],
             "paths": ["films/inner-life-of-data/source"]},
            {"name": "The Inner Life of Data, Spanish", "key": "inner-life-of-data-es",
             "dir": "films/inner-life-of-data/source", "lang": "es",
             "player": "dist/es/film.js", "site_player": "site/assets/film/film.es.js",
             "video": "dist/es/inner-life-of-data.es.mp4", "file": "inner-life-of-data.es.mp4",
             "captions": [["films/inner-life-of-data/captions/es.srt", "inner-life-of-data.es.srt"]],
             "paths": ["films/inner-life-of-data/source"]},
            {"name": "A Sharper Sketch", "key": "a-sharper-sketch-en",
             "dir": "films/a-sharper-sketch/source", "lang": "en",
             "player": "dist/film.js", "site_player": "site/assets/film3/film.js",
             "video": "dist/a-sharper-sketch.mp4", "file": "a-sharper-sketch.mp4",
             "captions": [["films/a-sharper-sketch/captions/en.srt", "a-sharper-sketch.en.srt"], ["films/a-sharper-sketch/captions/es.srt", "a-sharper-sketch.es.srt"]],
             "paths": ["films/a-sharper-sketch/source", ":(exclude)films/a-sharper-sketch/source/src/i18n/es/captions.js",
                       "films/inner-life-of-data/source/src", "films/inner-life-of-data/source/fonts"]},
            {"name": "Silent change", "key": "silent-change-en",
             "dir": "films/when-things-go-wrong/1-silent-change/source", "lang": "en",
             "player": "dist/film.js", "site_player": "site/assets/silent-change/film.js",
             "video": "dist/silent-change.mp4", "file": "silent-change.mp4",
             "captions": [["films/when-things-go-wrong/1-silent-change/captions/en.srt", "silent-change.en.srt"], ["films/when-things-go-wrong/1-silent-change/captions/es.srt", "silent-change.es.srt"]],
             "paths": ["films/when-things-go-wrong/1-silent-change/source", ":(exclude)films/when-things-go-wrong/1-silent-change/source/src/i18n/es/captions.js",
                       "films/when-things-go-wrong/characters",
