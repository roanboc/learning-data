# Runs only the checks a change needs: the site's static checks when the site changed, its browser checks on the pages
# the change touched (a changed page, or one that loads a changed file), and each film's checks when that film's source
# or the shared code it draws with changed (build, the site plays that build, its tools/check.py, and its tools/quiet.py
# where it has one). A change to only the site's copy of a film's player builds the film and compares the two; a change
# to only a film's other published files, such as a soundtrack or a poster, runs no film job (the site checks cover
# those files). .github/scripts/affected.py picks them; run it locally too.
# On a pull request it compares with the base branch, on a push to main with the commit before it.
# Run every check by hand: Actions → Checks → Run workflow.
# The dbt project has its own workflow, credential-project.yml.
name: Checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: "all (every check), or changed (compared with main)"
        required: true
        default: all

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every push to main runs on its own and is never cancelled or
# replaced: Publish site waits for a passing run on main, and with frequent merges a shared queue (one waiting run,
# replaced by the next) still left most merges without a finished run.
concurrency:
  group: checks-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Choose the checks
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.plan.outputs.site }}
      browser: ${{ steps.plan.outputs.browser }}
      pages: ${{ steps.plan.outputs.pages }}
      films: ${{ steps.plan.outputs.films }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Keep commit history for merge-base, but do not download historical media blobs.
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Planner/workflow changes exercise the policy without checking every film.
      - name: Test the tooling contracts
        run: python -m unittest discover -s tests -v

      - name: Lint the workflows
        run: |
          lint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$lint_dir"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck= -pyflakes=

      - name: Check the module catalog
        run: python site-tools/catalog.py --check

      - name: Check audio pointers and local copies
        run: python site-tools/media.py check

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) args="--base $PR_BASE" ;;
            merge_group) args="--base $GROUP_BASE" ;;
            push)
              # a new branch, or a push git can't compare with, checks everything
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then args="--base $BEFORE"; else args="--all"; fi ;;
            *) if [ "$SCOPE" = changed ]; then args="--base origin/main"; else args="--all"; fi ;;
          esac
          python3 .github/scripts/affected.py --github $args

  site:
    name: Site
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml

      - name: Install the tools
        uses: ./.github/actions/check-tools
        with:
          site: 'true'
          browser: ${{ needs.plan.outputs.browser }}

      - name: Static checks
        run: python site-tools/check_site.py

      # on the pages the change touched, or on every page ("all")
      - name: Browser checks
        if: needs.plan.outputs.browser == 'true'
        env:
          PAGES: ${{ needs.plan.outputs.pages }}
        run: |
          python site-tools/media.py fetch --pages "$PAGES"
          if [ "$PAGES" = all ]; then python site-tools/smoke.py; else python site-tools/smoke.py --pages "$PAGES"; fi

  film:
    name: Film (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # checks: full (the source changed) runs every step below; player (only the site's copy of the player changed)
        # builds and compares but draws no frame, since the picture didn't change
        include: ${{ fromJSON(needs.plan.outputs.films) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml

      # only the browser, and the sound check's numpy and scipy: the checks don't voice, mix or render
      - name: Install the tools
        if: matrix.checks == 'full'
        uses: ./.github/actions/check-tools
        with:
          browser: 'true'
          sound: ${{ hashFiles(format('{0}/tools/quiet.py', matrix.dir)) != '' }}

      # Execute the same task list as affected.py --run on a contributor's machine.
      - name: Run the film plan
        env:
          FILM_KEY: ${{ matrix.key }}
          FILM_CHECKS: ${{ matrix.checks }}
        run: |
          python .github/scripts/affected.py --film "$FILM_KEY" --tier "$FILM_CHECKS" --run

  required:
    name: Required checks
    needs: [plan, site, film]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          PLAN: ${{ needs.plan.result }}
          SITE: ${{ needs.site.result }}
          FILM: ${{ needs.film.result }}
        run: |
          [ "$PLAN" = success ] && [[ "$SITE" = success || "$SITE" = skipped ]] && [[ "$FILM" = success || "$FILM" = skipped ]]
