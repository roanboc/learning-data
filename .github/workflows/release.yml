# Renders the films (the topic films and the two Making of films) and publishes the videos and captions to one GitHub release.
# Run it by hand: Actions → Render and release the films → Run workflow.
#
# Which films to render (the "films" input):
#   changed  (the default) only the films whose source changed since the latest release, including shared code
#            such as the first film's engine, which every film draws with. Nothing changed: nothing is rendered.
#   all      every film, in about 30 to 45 minutes; the films render at the same time.
#   a list   keys separated by commas, such as silent-change-en,too-good-to-be-true-en (each film's key is in its release.json).
# Every release still carries every film: the videos that aren't rendered are copied from the latest release,
# so the site's download buttons, which point to the latest release, always find each file.
# See films/inner-life-of-data/source/README.md, section Publish.
name: Render and release the films

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Use a new tag for a new version; running again with the same tag replaces its files.
        required: true
        default: v2.0
      films:
        description: "Which films to render: changed (since the latest release), all, or keys separated by commas, such as silent-change-en"
        required: true
        default: changed
      draft:
        description: Save a new release as a draft, to watch the videos before the download buttons point to them.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-film
  cancel-in-progress: false

jobs:
  plan:
    name: Choose the films to render
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      films: ${{ steps.plan.outputs.films }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHOICE: ${{ inputs.films }}
        # FILMS: one entry per video, each in its film's own folder (release.json), gathered by .github/scripts/films.py, which
        # says what an entry holds. "paths" lists everything the video is built from: a change under any of them means the video
        # needs rendering again; captions only (the files, and src/i18n/<lang>/captions.js) never change the picture.
        run: |
          python3 .github/scripts/films.py > films.json
          python3 .github/scripts/plan.py films.json "$CHOICE"

      - uses: actions/upload-artifact@v7
        with:
          name: films
          path: films.json
          retention-days: 3

  render:
    name: Render (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      FILM_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt

      - name: Install the tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Every film uses the first film's voice model, from films/inner-life-of-data/source/models.
      - name: Restore the voice model
        uses: actions/cache@v6
        with:
          path: films/inner-life-of-data/source/models
          key: kokoro-model-files-v1.0

      - name: Download the voice model
        working-directory: films/inner-life-of-data/source
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "models/$f" ] || curl -fsSL --retry 3 -o "models/$f" "$base/$f"
          done

      # Keeps the committed timings, so the video, the site's player and the captions share one timeline.
      - name: Voice the narration
        run: python tools/tts.py --keep-timings

      - name: Build the player
        run: python tools/build.py

      - name: Check that the site plays this film
        env:
          PLAYER: ${{ matrix.player }}
          SITE_PLAYER: ${{ github.workspace }}/${{ matrix.site_player }}
        run: |
          if ! cmp -s "$PLAYER" "$SITE_PLAYER"; then
            echo "::error title=The site plays an older film::Build the film and copy $PLAYER to ${{ matrix.site_player }}, as the film's source README says, then run this again."
            exit 1
          fi
          echo "The site's player is built from this source."

      - name: Check that every moment draws
        run: python tools/check.py

      - name: Mix the soundtrack
        run: python tools/audio.py

      - name: Build the player with the soundtrack
        run: python tools/build.py

      - name: Render the video
        run: python tools/render.py --workers "$(nproc)"

      - name: Add the pacing report to the summary
        run: |
          {
            echo "### Pacing: ${{ matrix.name }}"
            echo '```'
            python tools/pace.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: video-${{ matrix.key }}
          path: ${{ matrix.dir }}/${{ matrix.video }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [plan, render]
    # runs when the renders all passed, or when there was nothing to render (a new tag still gets every film)
    if: always() && needs.plan.result == 'success' && (needs.render.result == 'success' || needs.render.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: films
          path: .

      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.count != '0'
        with:
          pattern: video-*
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          RENDERED: ${{ needs.plan.outputs.films }}
        run: |
          mkdir -p out
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          target=$(gh release view "$TAG" --json tagName --jq .tagName 2>/dev/null || true)
          # every caption file, from this commit: they sit beside the videos, which have no captions on the picture
          jq -r '.[] | .captions[] | @tsv' films.json | while IFS=$'\t' read -r captions srt; do cp "$captions" "out/$srt"; done
          # every video: rendered now, or else carried over from this tag (running it again) or from the latest release
          while IFS=$'\t' read -r key file; do
            [ -f "out/$file" ] && { echo "- $file: rendered from this commit" >> summary.md; continue; }
            for from in $target $latest; do
              if gh release download "$from" -p "$file" -D out --clobber 2>/dev/null; then
                echo "- $file: carried over from release $from" >> summary.md; break
              fi
            done
            if [ ! -f "out/$file" ]; then
              echo "::error title=No video for $key::$file wasn't rendered and isn't in an earlier release. Run this again with films set to $key, or to all."
              exit 1
            fi
          done < <(jq -r '.[] | [.key, .file] | @tsv' films.json)
          ls -l out
          { echo "### Videos in release $TAG"; cat summary.md; } >> "$GITHUB_STEP_SUMMARY"
          cat > notes.md <<EOF
          The Learning Data films. Each video is 1080p, with no captions on the picture: its captions come beside it as \`.srt\` files, one per language, for the platform or player to show. Upload the one you want with the video.

          $(python3 .github/scripts/films.py --notes)

          Rendered for this release, from commit $GITHUB_SHA: ${RENDERED:-none; every video is carried over from the previous release}.

          Watch them with chapters, then try the hands-on labs and scenarios: https://data.learn-all.org/

          The narration is a synthetic voice. The university, people and numbers are fictional. The films are licensed CC BY 4.0; the Databricks and dbt logos belong to their owners (see NOTICE.md).
          EOF
          if [ -n "$target" ]; then
            gh release upload "$TAG" out/* --clobber
            echo "Replaced the files of release $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            draft=(); [ "$DRAFT" = true ] && draft=(--draft)
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "Learning Data films · $TAG" --notes-file notes.md "${draft[@]}"
            if [ "$DRAFT" = true ]; then echo "Saved release $TAG as a draft: publish it under Releases when the videos look right." >> "$GITHUB_STEP_SUMMARY"; else echo "Published release $TAG." >> "$GITHUB_STEP_SUMMARY"; fi
          fi
