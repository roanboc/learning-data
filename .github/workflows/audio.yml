# Publishes a film's audio release from its pull request, so nobody runs it by hand and the MP3 never
# reaches main. A pull request that adds or changes an audio.json pointer or an MP3 publishes every
# missing audio release whose MP3 is in the branch, downloads and verifies every pointer's copy, and
# then fails while any soundtrack is still tracked: run `python site-tools/media.py untrack` on the
# branch and push, and the squash merge brings only the pointer. Pushes to main do the same for
# anything that got there (without the last check), and it runs once a day for anything a run missed.
# Audio releases are prereleases, so they never replace the video release used by the site's
# latest-download links, and existing assets are never uploaded again or replaced. Run it by hand only
# to resume, or for one tag or film; a blank tag publishes every missing release.
name: Store audio outside Git

on:
  pull_request:
    paths:
      - 'films/**/audio.json'
      - 'site/assets/**/*.mp3'
      - 'site-tools/media.py'
      - '.github/workflows/audio.yml'
  push:
    branches: [main]
    paths:
      - 'films/**/audio.json'
      - 'site/assets/**/*.mp3'
      - 'site-tools/media.py'
      - '.github/workflows/audio.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "Audio release tag; blank publishes every missing release (the first migration was audio-v1)"
        required: false
        default: ""
      film:
        description: "Optional film release key; blank with a tag publishes the whole tag"
        required: false

permissions:
  contents: read

# Pushes and scheduled runs have no inputs, so they queue with a blank manual run instead of racing it.
# Each pull request queues on its own, so one branch's run never replaces another's.
concurrency:
  group: audio-release-${{ inputs.tag || 'all' }}${{ github.event.pull_request.number && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: false

jobs:
  publish:
    # A fork's pull request has no right to create releases.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Publish or resume the selected immutable audio assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FILM: ${{ inputs.film }}
        run: |
          args=()
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          if [ -n "$FILM" ]; then args+=(--film "$FILM"); fi
          python site-tools/media.py publish "${args[@]}"
      - name: Soundtracks leave the branch before it merges
        if: github.event_name == 'pull_request'
        run: |
          tracked=$(git ls-files 'site/assets/**/*.mp3')
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::Their release copies are published and verified. Run 'python site-tools/media.py untrack' on this branch, commit the removal and push, so main never stores the MP3."
            exit 1
          fi
          echo "No soundtrack is tracked: the merge brings only the pointers."
