models:

  - name: core_learner
    description: >
      What the model knows about a learner from valid_from until valid_to.
      {{ doc("learner") }}
    latest_version: 1
    config:
      meta:
        grain: One row per learner per version
        owner: Mei Tanaka, registrar's office
        domain: registrar
        glossary_term: learner
    constraints:
      - type: primary_key
        name: pk_core_learner
        columns: [learner_key, valid_from]
        warn_unenforced: false
    data_tests:
      - unique_combination:
          arguments:
            columns: [learner_key, valid_from]
      - versions_do_not_overlap:
          arguments:
            key_columns: [learner_key]
    columns:
      - name: learner_key
        description: '{{ doc("learner_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        config:
          meta: {glossary_term: learner, personal_data: pseudonymous}
      - name: learner_bk
        description: '{{ doc("learner_bk") }}'
        data_type: string
        constraints: [{type: not_null}]
        config:
          meta: {personal_data: direct}
      - name: valid_from
        description: '{{ doc("valid_from") }}'
        data_type: date
        constraints: [{type: not_null}]
      - name: valid_to
        description: '{{ doc("valid_to") }}'
        data_type: date
      - name: is_current
        description: '{{ doc("is_current") }}'
        data_type: boolean
        constraints: [{type: not_null}]
      - name: recorded_at
        description: '{{ doc("recorded_at") }}'
        data_type: timestamp
      - name: full_name
        description: The learner's name, from the student system if it knows them, then the learning platform, then short courses.
        data_type: string
        config:
          meta: {personal_data: direct}
      - name: email
        description: The learner's email, lower case, from the same systems in the same order.
        data_type: string
        config:
          meta: {personal_data: direct}
      - name: status
        description: '{{ doc("learner_status") }}'
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [studying, inactive, withdrawn, completed]
      - name: enrolled_award_key
        description: The award the learner is enrolled in, in the student system. Null for learners it doesn't know.
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('core_award')
                field: award_key
      - name: enrolled_award_bk
        description: '{{ doc("award_bk") }}'
        data_type: string
      - name: key_set
        description: '{{ doc("learner_key_set") }}'
        data_type: string
      - name: keys_held
        description: '{{ doc("keys_held") }}'
        data_type: int
      - name: has_student_id
        description: '{{ doc("has_student_id") }}'
        data_type: boolean
    versions:
      - v: 1
        defined_in: core_learner

  - name: core_award
    description: >
      An award the university offers, as it stood from valid_from until valid_to.
      {{ doc("award") }}
    latest_version: 1
    config:
      meta:
        grain: One row per award per version
        owner: Mei Tanaka, registrar's office
        domain: registrar
        glossary_term: award
    constraints:
      - type: primary_key
        name: pk_core_award
        columns: [award_key, valid_from]
        warn_unenforced: false
    data_tests:
      - unique_combination:
          arguments:
            columns: [award_key, valid_from]
      - versions_do_not_overlap:
          arguments:
            key_columns: [award_key]
    columns:
      - name: award_key
        description: '{{ doc("award_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        config:
          meta: {glossary_term: award}
      - name: award_bk
        description: '{{ doc("award_bk") }}'
        data_type: string
        constraints: [{type: not_null}]
      - name: valid_from
        description: '{{ doc("valid_from") }}'
        data_type: date
        constraints: [{type: not_null}]
      - name: valid_to
        description: '{{ doc("valid_to") }}'
        data_type: date
      - name: is_current
        description: '{{ doc("is_current") }}'
        data_type: boolean
        constraints: [{type: not_null}]
      - name: award_code
        description: The registrar's code for the award, like GCDA.
        data_type: string
        constraints: [{type: not_null}]
      - name: award_name
        description: The award's name, as it stood in this version.
        data_type: string
      - name: award_type
        description: '{{ doc("award_type") }}'
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [graduate certificate, master]
      - name: credit_points_required
        description: '{{ doc("credit_points_required") }}'
        data_type: int
        constraints:
          - type: check
            name: ck_core_award_credit_points_required
            expression: "credit_points_required > 0"
      - name: faculty_code
        description: '{{ doc("faculty_code") }}'
        data_type: string
      - name: faculty_name
        description: '{{ doc("faculty_name") }}'
        data_type: string
    versions:
      - v: 1
        defined_in: core_award

  - name: core_credential
    description: >
      A credential issued to a learner by any of the three systems, with its history: issued
      on a date, and revoked on a date if it is. status is as it is now; issued_on and
      revoked_on say whether it counted on any other day. {{ doc("credential") }}
    latest_version: 2
    config:
      meta:
        grain: One row per credential
        owner: Mei Tanaka, registrar's office
        domain: registrar
        glossary_term: credential
    columns:
      - name: credential_key
        description: '{{ doc("credential_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
        config:
          meta: {glossary_term: credential}
      - name: credential_bk
        description: '{{ doc("credential_bk") }}'
        data_type: string
        constraints: [{type: not_null}]
      - name: learner_key
        description: '{{ doc("learner_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('core_learner')
                field: learner_key
        config:
          meta: {glossary_term: learner, personal_data: pseudonymous}
      - name: learner_bk
        description: '{{ doc("learner_bk") }}'
        data_type: string
        constraints: [{type: not_null}]
        config:
          meta: {personal_data: direct}
      - name: key_set
        description: '{{ doc("key_set") }}'
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('key_sets')
                field: key_set
      - name: credential_kind
        description: '{{ doc("credential_kind") }}'
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [award, microcredential, badge]
      - name: credential_code
        description: The issuing system's code for what the credential is for, like MC-SQL or GCDA.
        data_type: string
      - name: credential_name
        description: '{{ doc("credential_name") }}'
        data_type: string
      - name: credit_points
        description: '{{ doc("credential_credit_points") }}'
        data_type: int
      - name: issued_on
        description: '{{ doc("issued_on") }}'
        data_type: date
        constraints: [{type: not_null}]
      - name: status
        description: '{{ doc("credential_status") }}'
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [valid, expired, revoked]
      - name: revoked_on
        description: '{{ doc("revoked_on") }}'
        data_type: date
      - name: loaded_at
        description: '{{ doc("loaded_at") }}'
        data_type: timestamp
    # Each version is its own table in the same schema, so each names its own primary key:
    # Unity Catalog wants constraint names unique within a schema.
    versions:
      - v: 2
        constraints:
          - type: primary_key
            name: pk_core_credential_v2
            columns: [credential_key]
            warn_unenforced: false
      - v: 1
        deprecation_date: 2027-03-31
        description: >
          Version 1: a credential issued to a learner, with is_revoked in place of status.
          Deprecated: status replaces is_revoked in version 2, because a credential can also
          expire. Built from version 2 until 31 March 2027.
        constraints:
          - type: primary_key
            name: pk_core_credential_v1
            columns: [credential_key]
            warn_unenforced: false
        columns:
          - include: all
            exclude: [learner_bk, status, revoked_on, loaded_at]
          - name: is_revoked
            description: True when the credential was revoked. Replaced by status in version 2.
            data_type: boolean

  - name: core_credit_towards_award
    description: >
      The credit a learner held towards an award from valid_from until valid_to.
      {{ doc("credit_towards_award") }}
    latest_version: 1
    config:
      meta:
        grain: One row per learner per award per version
        owner: Mei Tanaka, registrar's office
        domain: registrar
        glossary_term: credit towards an award
    constraints:
      - type: primary_key
        name: pk_core_credit_towards_award
        columns: [learner_award_key, valid_from]
        warn_unenforced: false
    data_tests:
      - unique_combination:
          arguments:
            columns: [learner_key, award_key, valid_from]
      - versions_do_not_overlap:
          arguments:
            key_columns: [learner_key, award_key]
    columns:
      - name: learner_award_key
        description: '{{ doc("learner_award_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        config:
          meta: {personal_data: pseudonymous}
      - name: learner_key
        description: '{{ doc("learner_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('core_learner')
                field: learner_key
        config:
          meta: {glossary_term: learner, personal_data: pseudonymous}
      - name: learner_bk
        description: '{{ doc("learner_bk") }}'
        data_type: string
        config:
          meta: {personal_data: direct}
      - name: award_key
        description: '{{ doc("award_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('core_award')
                field: award_key
      - name: award_bk
        description: '{{ doc("award_bk") }}'
        data_type: string
      - name: valid_from
        description: '{{ doc("valid_from") }}'
        data_type: date
        constraints: [{type: not_null}]
      - name: valid_to
        description: '{{ doc("valid_to") }}'
        data_type: date
      - name: is_current
        description: '{{ doc("is_current") }}'
        data_type: boolean
        constraints: [{type: not_null}]
      - name: credit_points_from_units
        description: '{{ doc("credit_points_from_units") }}'
        data_type: int
      - name: credit_points_from_microcredentials
        description: '{{ doc("credit_points_from_microcredentials") }}'
        data_type: int
      - name: credit_points_earned
        description: '{{ doc("credit_points_earned") }}'
        data_type: int
        constraints:
          - type: not_null
          - type: check
            name: ck_core_credit_towards_award_earned
            expression: "credit_points_earned >= 0"
      - name: microcredentials_counted
        description: How many microcredentials count towards this award in this version.
        data_type: int
    versions:
      - v: 1
        defined_in: core_credit_towards_award
