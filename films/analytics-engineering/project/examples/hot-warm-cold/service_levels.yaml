# How fresh, and how long it's kept: Noor's answers, as each went into the data's contract in September
# 2026. Four documents, one per contract, each with only what the answer sets: the Open Data Contract
# Standard's service levels (slaProperties, v3.1.0), its owner, and its temperature, set by when someone
# acts on the data, not by what the platform can do:
#   hot   milliseconds to a few seconds: a machine acts, and the action must come at once
#   warm  minutes to hours: a person acts within the day
#   cold  days and longer: people decide over days and weeks
# The platform offers all three; which one each kind of data gets is the business's call. Where a file is
# kept (its storage tier) follows how often it's read, a separate question (storageTier, below).
# Written by hand for the films: the project's own contracts are generated (governance/5-data-contracts/),
# and every one of them is cold, built each night.
apiVersion: v3.1.0
kind: DataContract
id: 2a3e5c1d-7b40-4e6f-9a21-0c8d5f3b6e17
name: contracts
version: 1.1.0
status: active
domain: hr
description:
  purpose: Every contract in the HR system as it stands now, for the claims app, which checks each claim
    against it. Claims approved by noon on Monday are paid on Thursday, so a change HR records on a Monday
    morning has to reach the app before noon.
  limitations: No pay or rate of pay travels in it.
slaProperties:
- id: contracts_latency
  property: latency
  value: 5
  unit: m
  element: contracts.changed_at
  driver: operational
  description: Each change HR records is in the table within five minutes, as coordinators approve claims
    all morning. Until September 2026, once a night. Until the new ERP brings contracts and claims into
    one system (2028), the platform fills the gap.
- id: contracts_frequency
  property: frequency
  value: 5
  unit: m
  driver: operational
  scheduler: cron
  schedule: '*/5 * * * *'
  description: The pipeline runs every five minutes, triggered, never continuously.
team:
  name: Ingrid Holm, HR
  members:
  - username: ingrid.holm@uni.example
    name: Ingrid Holm, HR
    role: owner
customProperties:
- property: temperature
  value: warm
  description: Acted on within minutes or hours, by a person approving claims.
---
apiVersion: v3.1.0
kind: DataContract
id: 8f1c6d42-3e95-4b07-b2d8-5a6e9c0f4d31
name: spending_by_faculty
version: 1.0.0
status: active
domain: finance
description:
  purpose: What each faculty has spent this year against its budget, read each morning by Finance and the
    faculties' managers. Only the answer, one row per faculty, never a copy of the ledger.
slaProperties:
- id: spending_frequency
  property: frequency
  value: 1
  unit: d
  driver: analytics
  scheduler: cron
  schedule: 0 2 * * *
  description: Worked out each night at 02:00, Sydney time, from the finance system's ledger, read in place.
- id: spending_latency
  property: latency
  value: 1
  unit: d
  driver: analytics
  description: Yesterday's figures. Fresh enough, since no one acts on them sooner.
- id: spending_ready
  property: timeOfAvailability
  value: '07:00'
  driver: analytics
  description: Ready by 7 a.m., Sydney time.
team:
  name: Rohan Desai, Finance
  members:
  - username: rohan.desai@uni.example
    name: Rohan Desai, Finance
    role: owner
customProperties:
- property: temperature
  value: cold
  description: Acted on days or weeks later, as spending is talked over once a month, and only then does
    money move between budgets. A nightly batch.
