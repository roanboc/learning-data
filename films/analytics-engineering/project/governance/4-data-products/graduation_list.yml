# A data product: what it's for, who answers for it, what it promises and to whom. Written by hand,
# owned by its owner. scripts/generate/products.py writes its product descriptor from this file and
# the dbt models; only a canonical table has an enterprise contract, written by data governance.

name: graduation_list
title: Graduation list
owner: "Mei Tanaka, registrar's office"
domain: student
status: active
version: 1.0.0
description:
  purpose: Who graduates, at which ceremony, with which award, and their name as it will be printed
    on the degree certificate, for every ceremony in the Great Hall.
  usage: For the graduations office, to seat the hall, print the programme and send the certificates
    to the printer, and for Planning's count of awards for the government. Each use, and the level
    it needs, is a quality rule in the contract.
outputs:
  - {model: mart_graduations__graduation_list}
service_levels:
  - {property: latency, value: 24, unit: h, element: "mart_graduations__graduation_list.student_system_as_of, mart_graduations__graduation_list.portal_as_of", driver: operational, description: "Built every night; each source at most 24 hours old when the list goes to the printer, as agreed with Malia Fonoti on 22 June 2026."}
support:
  - {channel: graduations, tool: email, url: "mailto:graduations@uni.example", scope: issues}
  - channel: This isn't my name
    tool: other
    url: https://portal.uni.example/graduation/name
    scope: issues
    description: For a graduate's own name, the button beside it in the student portal, where they see it as it will be printed. The registrar's office answers within two working days, and tells them.
