# Runs only the checks a change needs: the site's static checks when the site changed, its browser checks on the pages
# the change touched (a changed page, or one that loads a changed file), and each film's checks when that film's source
# or the shared code it draws with changed (build, the site plays that build, its tools/check.py, and its tools/quiet.py
# where it has one). A change to only the site's copy of a film's player builds the film and compares the two; a change
# to only a film's other published files, such as a soundtrack or a poster, runs no film job (the site checks cover
# those files). .github/scripts/affected.py picks them; run it locally too.
# On a pull request it compares with the base branch, on a push to main with the commit before it.
# Run every check by hand: Actions → Checks → Run workflow.
# A file most pages load (site.css, a script every page or every film page loads) is checked on a sample of its pages; every night
# the browser checks run on every page (schedule), so what a sample missed shows by morning. The browser checks run in parallel
# jobs of about 40 pages each, beside the static checks, the tooling tests and the films (all of them in one job took 2.5 hours).
# The example dbt project lives in its own repository, roanboc/learning-data-project, with its own checks.
name: Checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'  # every page in a browser, every night
  workflow_dispatch:
    inputs:
      scope:
        description: "all (every check), pages (the site's checks on every page, no film), or changed (compared with main)"
        required: true
        default: all

permissions:
  contents: read

# A newer push to a pull request cancels its older run. On main a running Checks run is never cancelled; main's runs
# share one queue, where a newer push replaces a run still waiting, so after a burst of merges only the newest waits. That
# is enough because Publish site deploys the newest main commit whose Checks passed (one run per merge backed the shared
# runners up by an hour on 10 Nov 2026). The nightly run has its own queue, so it never holds up or replaces a push's run.
concurrency:
  group: checks-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Choose the checks
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.plan.outputs.site }}
      browser: ${{ steps.plan.outputs.browser }}
      pages: ${{ steps.plan.outputs.pages }}
      shards: ${{ steps.plan.outputs.shards }}
      tooling: ${{ steps.plan.outputs.tooling }}
      films: ${{ steps.plan.outputs.films }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Keep commit history for merge-base, but do not download historical media blobs.
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Lint the workflows
        run: |
          lint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$lint_dir"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck= -pyflakes=

      - name: Check the module catalog
        run: python site-tools/catalog.py --check

      - name: Check audio pointers and local copies
        run: python site-tools/media.py check

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) args="--base $PR_BASE" ;;
            merge_group) args="--base $GROUP_BASE" ;;
            schedule) args="--every-page" ;;
            push)
              # a new branch, or a push git can't compare with, checks everything
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then args="--base $BEFORE"; else args="--all"; fi ;;
            *) case "$SCOPE" in changed) args="--base origin/main" ;; pages) args="--every-page" ;; *) args="--all" ;; esac ;;
          esac
          python3 .github/scripts/affected.py --github $args

  # The tooling tests: the planner, the workflows and the shared check tools, when one of them changed.
  tooling:
    name: Tooling tests
    needs: plan
    if: needs.plan.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the tooling contracts
        run: python -m unittest discover -s tests -v

  site:
    name: Site
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml

      - name: Install the tools
        uses: ./.github/actions/check-tools
        with:
          site: 'true'

      - name: Static checks
        run: python site-tools/check_site.py

  # The browser checks, on the pages the change touched (or every page), split into parallel jobs of about 40 pages each
  browser:
    name: Browser (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml

      - name: Install the tools
        uses: ./.github/actions/check-tools
        with:
          site: 'true'
          browser: 'true'

      - name: Browser checks
        env:
          PAGES: ${{ matrix.pages }}
        run: |
          python site-tools/media.py fetch --pages "$PAGES"
          python site-tools/smoke.py --pages "$PAGES"

  film:
    name: Film (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # checks: full (the source changed) runs every step below; player (only the site's copy of the player changed)
        # builds and compares but draws no frame, since the picture didn't change
        include: ${{ fromJSON(needs.plan.outputs.films) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml

      # only the browser, and the sound check's numpy and scipy: the checks don't voice, mix or render
      - name: Install the tools
        if: matrix.checks == 'full'
        uses: ./.github/actions/check-tools
        with:
          browser: 'true'
          sound: ${{ hashFiles(format('{0}/tools/quiet.py', matrix.dir)) != '' }}

      # Execute the same task list as affected.py --run on a contributor's machine.
      - name: Run the film plan
        env:
          FILM_KEY: ${{ matrix.key }}
          FILM_CHECKS: ${{ matrix.checks }}
        run: |
          python .github/scripts/affected.py --film "$FILM_KEY" --tier "$FILM_CHECKS" --run

  required:
    name: Required checks
    needs: [plan, tooling, site, browser, film]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          PLAN: ${{ needs.plan.result }}
          TOOLING: ${{ needs.tooling.result }}
          SITE: ${{ needs.site.result }}
          BROWSER: ${{ needs.browser.result }}
          FILM: ${{ needs.film.result }}
        run: |
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          [ "$PLAN" = success ] && ok "$TOOLING" && ok "$SITE" && ok "$BROWSER" && ok "$FILM"
