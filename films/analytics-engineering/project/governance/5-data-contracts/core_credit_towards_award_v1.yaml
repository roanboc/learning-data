  physicalName: core_credit_towards_award_v1
  logicalType: object
  physicalType: table
  description: 'The credit a learner held towards an award from valid_from until valid_to. **Credit towards
    an award.** The credit points a learner holds towards an award: from units passed under it, and from
    the microcredentials it recognises. - Business key: The learner''s business key and the award''s,
    together. - Owner of the meaning: Mei Tanaka, registrar''s office. - Rule: A unit counts only with
    a passing grade (var passing_grades). - Rule: A microcredential counts towards each award that recognises
    it; the faculties decide which, in seeds/reference/student/credit_recognition.csv. - Rule: An award
    accepts a limited number of microcredentials towards its credit, the first ones issued (var microcredentials_per_award).
    - Rule: A revoked credential never counts, from the day it''s revoked. - Rule: Credit changes over
    time, and every change is a new version. - Not in the business glossary: data governance confirmed
    there''s no term for it, on 2026-10-20.'
