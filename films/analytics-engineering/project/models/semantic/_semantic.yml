models:

  - name: metricflow_time_spine
    description: One row per day, from 2025 to 2027, for the semantic layer's time calculations.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: The day.
        granularity: day

semantic_models:

  - name: near_award
    description: >
      Planning's fact: one row per learner per award, as at census date. The measures are
      defined here once, and every metric builds on them.
    model: ref('mart_planning__near_award')
    defaults:
      agg_time_dimension: census_date
    entities:
      - name: learner_award
        type: primary
        expr: learner_award_key
      - name: learner
        type: foreign
        expr: learner_key
      - name: award
        type: foreign
        expr: award_key
    dimensions:
      - name: census_date
        type: time
        type_params:
          time_granularity: day
      - name: faculty_name
        type: categorical
      - name: award_type
        type: categorical
      - name: learner_status
        type: categorical
      - name: is_enrolled
        type: categorical
      - name: is_near_award
        type: categorical
    measures:
      - name: learners
        description: Learners, each counted once.
        agg: count_distinct
        expr: learner_key
      - name: credit_points_earned
        description: Credit points earned towards the award.
        agg: sum
      - name: credit_points_remaining
        description: Credit points still needed.
        agg: sum

metrics:

  - name: learners_near_graduate_certificate
    label: Learners near a graduate certificate
    description: >
      Planning's question: learners studying for a graduate certificate and within the var
      near_award_credit_points of it, as at census date. Group by faculty_name for the answer
      by faculty.
    type: simple
    type_params:
      measure: learners
    filter: |
      {{ Dimension('learner_award__is_near_award') }} and {{ Dimension('learner_award__award_type') }} = 'graduate certificate'

  - name: credit_points_towards_award
    label: Credit points towards an award
    description: Credit points learners held towards the awards they're enrolled in, as at census date.
    type: simple
    type_params:
      measure: credit_points_earned
    filter: |
      {{ Dimension('learner_award__is_enrolled') }}
