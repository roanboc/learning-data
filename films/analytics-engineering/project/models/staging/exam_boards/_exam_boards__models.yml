models:

  - name: stg_exam_boards__approved_awards
    description: >
      One row per version of an award a faculty's exam board approved, as the boards' register
      recorded it. In the group graduations, so the graduation list can be reconciled with it.
    config:
      group: graduations
      meta: {owner: "Registrar's office, with the faculties", domain: registrar}
    data_tests:
      - unique_combination:
          arguments:
            columns: [approval_bk, recorded_from]
          config:
            meta: {owner: "Registrar's office, with the faculties"}
    columns:
      - name: approval_key
        description: The hash of approval_bk.
      - name: approval_bk
        description: '{{ doc("qualified_key") }}'
        data_tests:
          - not_null:
              config:
                meta: {owner: "Registrar's office, with the faculties"}
        config:
          meta: {personal_data: none}
      - name: student_bk
        description: The graduate's student ID, qualified by the student system's key set, like SIS|S-16874.
        data_tests:
          - not_null:
              config:
                meta: {owner: "Registrar's office, with the faculties"}
        config:
          meta: {personal_data: direct}
      - name: award_bk
        description: '{{ doc("award_bk") }}'
        data_tests:
          - relationships:
              arguments:
                to: ref('core_award')
                field: award_bk
              config:
                meta: {owner: "Registrar's office, with the faculties"}
      - name: award_code
        description: The award's code, like MDA.
      - name: conferred_on
        description: The day the board approved the award, printed on the certificate as the conferral date.
        data_tests:
          - not_null:
              config:
                meta: {owner: "Registrar's office, with the faculties"}
      - name: faculty_code
        description: '{{ doc("faculty_code") }}'
      - name: recorded_from
        description: '{{ doc("recorded_from") }}'
      - name: recorded_to
        description: '{{ doc("recorded_to") }}'
      - name: is_current_version
        description: '{{ doc("is_current_version") }}'
      - name: loaded_at
        description: '{{ doc("loaded_at") }}'
