seeds:

  - name: key_sets
    description: >
      One row per key set: where a key comes from, the system's name and who owns it. Shared by
      every model and domain, like the hashing macro. Generated: scripts/generate/definitions.py
      writes it from each source's meta.key_set (sources/<system>/). Edit the source, not this file.
    config:
      column_types: {key_set: string, system_name: string, owner: string}
      meta: {owner: "Noor, data architect", domain: shared, purpose: reference}
    columns:
      - name: key_set
        description: '{{ doc("key_set") }}'
        data_tests: [unique, not_null]
      - name: system_name
        description: The system, in words.
      - name: owner
        description: Who owns the system.
