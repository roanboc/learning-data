schema:
- name: core_claim_v1
  physicalName: core_claim_v1
  logicalType: object
  physicalType: table
  description: 'A claim for hours worked, as it stands now in the claims app, with the pay type and teaching
    period of the contract it''s claimed under. **Claim.** A casual staff member''s claim for hours they
    worked: for one unit, one duty and one day, under their contract for that teaching period. The unit''s
    coordinator approves it, or returns it for a correction; an approved claim is paid on a pay day. -
    Business key: The claim ID the app issues, qualified by its key set, CLM|CL-104233. Issued by: The
    claims app. - Owner of the meaning: HR. - Rule: Hours are decimal hours, as the claims app''s contract
    says, 1.50 for an hour and a half. - Rule: Only an approved claim is paid. A submitted claim waits
    for its coordinator, and a returned one for a correction. - Rule: A claim approved by noon on the
    Monday before a pay day is paid that Thursday, and one approved later on the next pay day (pay_day_for(),
    on payroll''s calendar, the seed pay_days). - Rule: The contract it''s claimed under gives its pay
    type and its teaching period. - History: As it stands now. The claims app changes a claim in place,
    from submitted to approved or returned, and keeps no versions. - Not in the business glossary: data
    governance confirmed there''s no term for it, on 2026-03-04.'
