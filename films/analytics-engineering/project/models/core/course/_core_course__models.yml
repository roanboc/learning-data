models:

  - name: core_award
    description: >
      An award the university offers, as it stood from valid_from until valid_to.
      {{ doc("award") }}
    latest_version: 1
    config:
      meta:
        grain: One row per award per version
        owner: Mei Tanaka, registrar's office
        domain: course
        glossary_term: award
    constraints:
      - type: primary_key
        name: pk_core_award
        columns: [award_key, valid_from]
        warn_unenforced: false
    data_tests:
      - unique_combination:
          arguments:
            columns: [award_key, valid_from]
      - versions_do_not_overlap:
          arguments:
            key_columns: [award_key]
    columns:
      - name: award_key
        description: '{{ doc("award_key") }}'
        data_type: string
        constraints: [{type: not_null}]
        config:
          meta: {glossary_term: award}
      - name: award_bk
        description: '{{ doc("award_bk") }}'
        data_type: string
        constraints: [{type: not_null}]
      - name: valid_from
        description: '{{ doc("valid_from") }}'
        data_type: date
        constraints: [{type: not_null}]
      - name: valid_to
        description: '{{ doc("valid_to") }}'
        data_type: date
      - name: is_current
        description: '{{ doc("is_current") }}'
        data_type: boolean
        constraints: [{type: not_null}]
      - name: award_code
        description: '{{ doc("award_code") }}'
        data_type: string
        constraints: [{type: not_null}]
      - name: award_name
        description: '{{ doc("award_name") }} As it stood in this version.'
        data_type: string
      - name: award_type
        description: '{{ doc("award_type") }}'
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: [graduate certificate, master]
      - name: credit_points_required
        description: '{{ doc("credit_points_required") }}'
        data_type: int
        constraints:
          - type: check
            name: ck_core_award_credit_points_required
            expression: "credit_points_required > 0"
      - name: faculty_code
        description: '{{ doc("faculty_code") }}'
        data_type: string
      - name: faculty_name
        description: '{{ doc("faculty_name") }}'
        data_type: string
    versions:
      - v: 1
        defined_in: core_award
