# What the student system holds, against what the business expects. The schema is in requirements/README.md.
scope:
  kind: source
  name: student_system
  code: SIS

items:

  - id: GAP-SIS-01
    type: gap
    step: gaps_and_contracts
    title: Two students share an email
    expectation: One email, one learner.
    reality: >
      Two students share a family email, in the student system and on the platform
      (analyses/profiling/profile_shared_emails.sql).
    resolution: [rule_in_model]
    text: >
      An email matches only when exactly one learner has it. The registrar's office decides the
      rest.
    owner: Mei Tanaka, registrar's office
    status: delivered
    sources: [student_system, learning_platform]
    evidence: [analyses/profiling/profile_shared_emails.sql]
    implemented_in: [int_learner_key_candidates, int_learner_keys_matched, learner_identity_decisions]
    relates_to: [DEC-STU-04]

  - id: GAP-SIS-02
    type: gap
    step: gaps_and_contracts
    title: Changes are recorded late
    expectation: A change is dated when it happened.
    reality: >
      The student system records some changes late: a withdrawal effective on 27 March was
      recorded on 3 April (analyses/profiling/profile_late_changes.sql). The platforms only say
      when they recorded a change.
    resolution: [rule_in_model, accept]
    text: >
      Use the student system's effective date. Accept that platform dates are the day the platform
      recorded the change.
    owner: Mei Tanaka, registrar's office
    status: delivered
    sources: [student_system, learning_platform, short_courses]
    evidence: [analyses/profiling/profile_late_changes.sql]
    implemented_in: [int_learner_timeline]

  - id: GAP-SIS-03
    type: gap
    step: gaps_and_contracts
    title: No conferral record
    expectation: The student system says when an award was conferred.
    reality: It has no conferral record. The student's status turns completed.
    resolution: [rule_in_model, fix_at_source]
    text: >
      An award is conferred on the day the first completed version takes effect. A conferral
      record is requested from the registrar's office.
    owner: Mei Tanaka, registrar's office
    status: agreed
    implemented_in: [int_credentials_unioned]
