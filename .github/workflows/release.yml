# Renders the film in English and Spanish and publishes both videos to a GitHub release.
# Run it by hand: Actions → Render and release the film → Run workflow. It takes about 30 to 45 minutes.
# The site's download buttons point to the videos in the latest release.
# See films/inner-life-of-data/source/README.md, section Publish.
name: Render and release the film

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Use a new tag for a new version; running again with the same tag replaces its files.
        required: true
        default: v1.0
      draft:
        description: Save a new release as a draft, to watch the videos before the download buttons point to them.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-film
  cancel-in-progress: false

jobs:
  render:
    name: Render (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      matrix:
        include:
          - lang: en
            player: dist/film.js
            site_player: ../../../site/assets/film/film.js
            video: dist/inner-life-of-data.mp4
          - lang: es
            player: dist/es/film.js
            site_player: ../../../site/assets/film/film.es.js
            video: dist/es/inner-life-of-data.es.mp4
    defaults:
      run:
        working-directory: films/inner-life-of-data/source
    env:
      FILM_LANG: ${{ matrix.lang }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: films/inner-life-of-data/source/requirements.txt

      - name: Install the tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore the voice model
        uses: actions/cache@v6
        with:
          path: films/inner-life-of-data/source/models
          key: kokoro-model-files-v1.0

      - name: Download the voice model
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "models/$f" ] || curl -fsSL --retry 3 -o "models/$f" "$base/$f"
          done

      # Keeps the committed timings, so the video, the site's player and the captions share one timeline.
      - name: Voice the narration
        run: python tools/tts.py --keep-timings

      - name: Build the player
        run: python tools/build.py

      - name: Check that the site plays this film
        env:
          PLAYER: ${{ matrix.player }}
          SITE_PLAYER: ${{ matrix.site_player }}
        run: |
          if ! cmp -s "$PLAYER" "$SITE_PLAYER"; then
            echo "::error title=The site plays an older film::Build the film and copy $PLAYER to site/assets/film/, as the source README says under Publish, then run this again."
            exit 1
          fi
          echo "The site's player is built from this source."

      - name: Check that every moment draws
        run: python tools/check.py

      - name: Mix the soundtrack
        run: python tools/audio.py

      - name: Build the player with the soundtrack
        run: python tools/build.py

      - name: Render the video
        run: python tools/render.py --workers "$(nproc)"

      - name: Add the pacing report to the summary
        run: |
          {
            echo "### Pacing ($FILM_LANG)"
            echo '```'
            python tools/pace.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: video-${{ matrix.lang }}
          path: films/inner-life-of-data/source/${{ matrix.video }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  release:
    name: Publish the release
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: video-*
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          cp films/inner-life-of-data/captions/en.srt out/inner-life-of-data.en.srt
          cp films/inner-life-of-data/captions/es.srt out/inner-life-of-data.es.srt
          ls -l out
          cat > notes.md <<EOF
          *The Inner Life of Data*, in English and in Latin American Spanish (*La vida interior de los datos*), rendered from commit $GITHUB_SHA.

          - \`inner-life-of-data.mp4\`: English, 1080p.
          - \`inner-life-of-data.es.mp4\`: Spanish, 1080p.
          - \`.srt\` files: captions, for platforms that take them as a separate file.

          Watch it with chapters, then take the platform apart in hands-on labs: https://roanboc.github.io/learning-data/

          The narration is a synthetic voice. The university, people and numbers are fictional. The film is licensed CC BY 4.0; the Databricks and dbt logos belong to their owners (see NOTICE.md).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            echo "Replaced the files of release $TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            draft=(); [ "$DRAFT" = true ] && draft=(--draft)
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "The Inner Life of Data · $TAG" --notes-file notes.md "${draft[@]}"
            if [ "$DRAFT" = true ]; then echo "Saved release $TAG as a draft: publish it under Releases when the videos look right." >> "$GITHUB_STEP_SUMMARY"; else echo "Published release $TAG." >> "$GITHUB_STEP_SUMMARY"; fi
          fi
