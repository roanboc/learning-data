description:
  purpose: What casual staff are paid on each pay day, by faculty and unit, from the claims approved for
    it. Totals only.
  usage: For Finance, every pay day, to follow what casual teaching costs as it's paid. Built at 06:00
    on each pay day by the job payroll_export, deployed from the bundle (databricks.yml). For years a
    script on one person's laptop made it; since March 2026 it's built and tested like the rest of the
    project.
  limitations: 'LIM-FIN-02: Pay as the approved claims give it, not the payroll system''s pay slips: tax,
    on-costs and corrections made in the payroll system aren''t in. Finance adds on-costs in its own measure,
    casual teaching cost. LIM-FIN-03: Totals by unit: where only one person''s claims are paid for a unit
    on a pay day, the unit''s total is that person''s pay. Finance reads the export under payroll''s rules,
    and reports it by faculty.'
