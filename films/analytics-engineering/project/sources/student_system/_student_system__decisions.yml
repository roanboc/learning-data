# Decisions about the student_system source: what was decided, why, and who decided.
# Permanent: a decision is never deleted; a replaced one is marked superseded and relates to
# what replaced it. The schema is in requirements/README.md, and docs/decisions.md indexes
# every log. Not parsed by dbt (.dbtignore).

scope: {kind: source, name: student_system, code: SIS}

decisions:

  - id: DEC-SIS-01
    step: gaps_and_contracts
    title: An email matches only when exactly one learner has it
    text: An email matches only when exactly one learner has it. The registrar's office decides the rest.
    why: 'Expected: One email, one learner. Found: Two students share a family email, in the student system
      and on the platform (analyses/profiling/profile_shared_emails.sql).'
    decided_by: Mei Tanaka, registrar's office
    status: agreed
    sources: [student_system, learning_platform]
    evidence: [analyses/profiling/profile_shared_emails.sql]
    implemented_in: [int_learner_key_candidates, int_learner_keys_matched, learner_identity_decisions]
    relates_to: [DEC-STU-04]
    was: GAP-SIS-01

  - id: DEC-SIS-02
    step: gaps_and_contracts
    title: A change is dated by the student system's effective date
    text: Use the student system's effective date to date a change.
    why: 'Expected: A change is dated when it happened. Found: The student system records some changes late:
      a withdrawal effective on 27 March was recorded on 3 April (analyses/profiling/profile_late_changes.sql).
      The platforms only say when they recorded a change.'
    decided_by: Mei Tanaka, registrar's office
    status: agreed
    sources: [student_system, learning_platform, short_courses]
    evidence: [analyses/profiling/profile_late_changes.sql]
    implemented_in: [int_learner_timeline]
    relates_to: [LIM-STU-07]
    was: GAP-SIS-02

  - id: DEC-SIS-03
    step: gaps_and_contracts
    title: An award is conferred when the first completed version takes effect
    text: An award is conferred on the day the first completed version takes effect.
    why: 'Expected: The student system says when an award was conferred. Found: It has no conferral record.
      The student''s status turns completed.'
    decided_by: Mei Tanaka, registrar's office
    status: agreed
    implemented_in: [int_credentials_unioned]
    relates_to: [GAP-SIS-03]

  - id: DEC-SIS-04
    step: source_reality
    title: Records closed before November 2024 come from the archive
    text: The student system's records closed before 1 November 2024, when its history here starts, are read
      from its archive, as their own table, past_learners. The learner doesn't read it, since the questions
      it answers start in 2025. The person domain will, to find who a new record already is.
    why: 'Expected: Every student record the student system holds. Found: Its history here starts on
      1 November 2024, so graduates and withdrawals from before then are only in its archive
      (analyses/profiling/profile_keys_held.sql).'
    status: proposed
    evidence: [analyses/profiling/profile_keys_held.sql]
    relates_to: [LIM-SIS-01, DEC-PER-01]

  - id: DEC-SIS-05
    step: operate_and_evolve
    title: Test records never count
    text: Records the registrar's office makes to try a new screen are test records. They never count, in
      any count or mart.
    why: 'Expected: Every record in the student system is a student. Found: On the night of 21 October 2026,
      the census-day count was 14 over the census report: fourteen records, all made in one week, all dated
      back to February, made to try a new screen.'
    decided_by: Mei Tanaka, registrar's office
    decided_on: 2026-10-22
    status: agreed

  - id: DEC-SIS-06
    step: operate_and_evolve
    title: A name is corrected once, in the student system, by the registrar's office
    text: From 14 September 2026, every correction to a name is made once, in the student system, by the
      registrar's office, checked against the document seen at enrolment. Whoever finds a wrong name, a
      graduate in the portal or the graduations team, sends it there, and nobody keeps a corrected copy.
      The old names, from the online form before 2019 and the paper forms before 2015, are put right as
      each graduate confirms theirs, those due to graduate first. Two checks hold the doubtful ones for
      the office each night, a family name exactly 30 characters long and one in capitals only.
    why: 'Expected: A name corrected once stays corrected. Found: The graduations team corrected every list
      by hand in a copy, a spreadsheet, about 320 hours a year, and the student system never heard: in
      August 2026, Beatriz Fonseca de Albuquerque Cavalcanti''s master''s joined December''s list cut short
      again, after she had corrected her name in the portal for March''s.'
    decided_by: Mei Tanaka, registrar's office, with Malia Fonoti, graduations office
    decided_on: 2026-09-14
    status: agreed
    sources: [student_system, portal]
    implemented_in: [family_name_may_be_cut_short, family_name_in_capitals_only, hand_check_rounds]

  - id: DEC-SIS-07
    step: operate_and_evolve
    title: The nightly file keeps every letter, and a family name holds 100 characters
    text: From the night of 14 September 2026, the student system's nightly file to the platform keeps
      every letter, accents and all, and its family name field holds 100 characters, not 30. A night's
      file of more than 200 names with not one letter outside A to Z stops the night's update, so the
      graduation list keeps the night before's names, and the night's job tells Sam Okafor.
    why: 'Expected: A name arrives on the platform as the student system holds it. Found: The nightly file''s
      old encoding turned é into e, so December 2025''s list of 2,031 names had not one accent (143 names
      stored right lost theirs on the way in), and the 30-character field had cut 39 family names short.'
    decided_by: Student system team, with Sam Okafor, data platform, and Mei Tanaka, registrar's office
    decided_on: 2026-09-14
    status: agreed
    sources: [student_system]
    implemented_in: [night_file_keeps_every_letter, family_name_may_be_cut_short]
